<!doctype html>
<html lang="en" data-id="slate">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self'; connect-src https://cotidie-sync.karsten-vun.workers.dev; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cotidie">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Cotidie</title>
<link rel="stylesheet" href="fonts/fonts.css?v=202609210">
<style>
/* ======================================================================
   Cotidie — the rebuilt page (2026-09-17). One page, both languages.

   Type: ONE leading (1.4) and SIX sizes, set here and inherited everywhere,
   buttons and inputs included -- a <button>'s own font shorthand resets
   line-height to `normal`, which is what made the old cards look cramped.
   The faces are copied into fonts/ (SIL OFL) so the page works offline;
   should one fail to load, the Didot and Bodoni that ship with macOS stand in.
   ====================================================================== */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
:root{--t1:12px;--t2:14px;--t3:16px;--t4:20px;--t5:30px;--t6:44px;
  --display:"Bodoni Moda","Bodoni 72","GFS Didot","Didot",serif;
  --form:"Bodoni Moda","Bodoni 72","GFS Didot","Didot",serif;
  --body:"Jost","Avenir Next","Futura",system-ui,sans-serif}
html[data-id=slate]{--bg:#25323a;--panel:#2b3a43;--rule:#455962;--fg:#e9efec;--mute:#9db0b0;--hit:#3a5a53;--act:#e9efec;--actfg:#25323a;--good:#9fd6b0;--bad:#f0a890}
html[data-id=stone]{--bg:#e6e3dc;--panel:#eeebe5;--rule:#c2bcaf;--fg:#2b2a27;--mute:#726d64;--hit:#d5cebf;--act:#2b2a27;--actfg:#eeebe5;--good:#3d6b4a;--bad:#9a3f2c}
html[data-id=graph]{--bg:#f5f7fb;--panel:#ffffff;--rule:#15284a;--fg:#15284a;--mute:#4f6188;--hit:#dce7ff;--act:#1d4ed8;--actfg:#fff;--good:#1b6b47;--bad:#b3321f}
body{font:400 var(--t3)/1.4 var(--body);background:var(--bg);color:var(--fg);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;line-height:inherit;color:inherit}
[hidden]{display:none!important}
#app{min-height:100vh;display:flex;flex-direction:column}

.lab{font-size:var(--t1);letter-spacing:.14em;color:var(--mute);text-transform:uppercase}
.form{font-family:var(--form);text-transform:none;letter-spacing:0}
.mute{color:var(--mute)} .v{font-variant-numeric:tabular-nums}
kbd{font:400 var(--t1)/1 var(--body);border:1px solid currentColor;border-radius:3px;padding:2px 5px;opacity:.65;margin-left:8px}
.btn{display:inline-flex;align-items:center;background:var(--act);color:var(--actfg);border:1px solid var(--act);padding:7px 16px;border-radius:3px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn.quiet{background:none;color:var(--fg);border-color:var(--rule);font-weight:400}
.btn.small{padding:3px 10px;font-size:var(--t2)}
.btn:disabled{opacity:.4;cursor:default}
a,.link{color:var(--fg);cursor:pointer;text-decoration:none}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:16px;white-space:nowrap}
.row>:first-child{overflow:hidden;text-overflow:ellipsis}
.sec{display:flex;flex-direction:column;gap:8px}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:3px;overflow:hidden}
.seg button{background:none;border:0;padding:4px 12px;cursor:pointer;font-size:var(--t2)}
.seg button[aria-pressed=true]{background:var(--act);color:var(--actfg)}

/* the grid: Cotidie's emblem */
.grid{border-collapse:collapse;width:100%}
.grid th,.grid td{border:1px solid var(--rule);padding:8px 12px;text-align:left;height:46px}
html[data-id=graph] .grid th,html[data-id=graph] .grid td{border-width:1.5px}
.grid th{font-weight:400;font-size:var(--t1);letter-spacing:.14em;color:var(--mute);text-transform:uppercase;white-space:nowrap;width:1%}
.grid thead th{width:auto}
.grid td{font:400 var(--t4)/1.4 var(--form);background:var(--panel)}
.grid td.now{background:var(--hit);box-shadow:inset 0 0 0 2px var(--fg)}
.grid td.ok{color:var(--good)} .grid td.no{color:var(--bad)}
.row.ok .form{color:var(--good)} .row.no .form{color:var(--bad)}
.row input{width:220px;max-width:46vw;background:var(--panel);border:1px solid var(--rule);outline:0;padding:4px 8px;color:inherit;font:400 var(--t4)/1.4 var(--form);border-radius:0}
.row input:focus{border-color:var(--ink)}
.news{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.news p{margin:0;max-width:62ch;line-height:1.5;color:var(--ink)}
.grid td.none{background:none}
.grid td input.carried{color:var(--mute)}
.grid td input{width:100%;background:none;border:0;outline:0;font:400 var(--t4)/1.4 var(--form)}
.grid td:focus-within{background:var(--hit)}
.grid td small{font:400 var(--t1)/1.4 var(--body);color:var(--mute);margin-left:8px;letter-spacing:.04em}

/* ---- HOME ---- */
.homewrap{flex:1;display:flex;justify-content:center;gap:72px;padding:0 40px;width:100%;max-width:1440px;margin:0 auto}
.home{flex:0 0 400px;max-width:400px;padding:40px 0 24px;display:flex;flex-direction:column;gap:28px}
.top{display:flex;justify-content:space-between;align-items:center}
.mark{font:400 var(--t2)/1.4 var(--display);letter-spacing:.34em}
.mark-sync{background:none;border:0;padding:2px;cursor:pointer;display:grid;place-items:center}
.start{display:flex;align-items:center;gap:16px;white-space:nowrap}
.start .btn{font:500 var(--t4)/1.4 var(--display);padding:9px 22px}
.list{border-top:1px solid var(--rule)}
.list .row{padding:7px 0;border-bottom:1px solid var(--rule);font-size:var(--t2)}
.list .row.link:hover{background:var(--panel)}
.foot{margin-top:auto;display:flex;gap:20px;font-size:var(--t2);border-top:1px solid var(--rule);padding-top:12px}
.bar{height:10px;border:1px solid var(--rule);position:relative;background:var(--panel)}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--fg);max-width:100%}
.bar s{position:absolute;top:-4px;bottom:-4px;width:1px;background:var(--rule)}
.rail{flex:1;min-width:0;padding:40px 0 24px;display:flex;flex-direction:column;gap:32px}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:40px;margin-top:auto}
.map{display:flex;flex-direction:column;gap:10px}
.mgrp{display:grid;grid-template-columns:110px 1fr;gap:12px;align-items:start}
.msq{display:flex;flex-wrap:wrap;gap:3px}
.msq i{width:11px;height:11px;border:1px solid var(--rule);cursor:pointer}
.msq i.known,.legend i.known{background:var(--fg);border-color:var(--fg)}
.msq i.rotation,.legend i.rotation{background:var(--mute);border-color:var(--mute)}
.msq i.due,.legend i.due{background:var(--bad);border-color:var(--bad)}
.msq i:hover{outline:2px solid var(--fg);outline-offset:1px}
.legend{display:inline-flex;align-items:center;gap:6px;font-size:var(--t1);color:var(--mute)}
.legend i{width:9px;height:9px;border:1px solid var(--rule);margin-left:10px;display:inline-block}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;height:72px;align-items:end;position:relative;border-bottom:1px solid var(--rule)}
.week.lim::before{content:"";position:absolute;left:0;right:0;bottom:var(--lim,60px);border-top:1px dashed var(--mute)}
.week i{background:var(--rule);display:block;min-height:0}
.week i.today{background:var(--fg)} .week.fc i{background:var(--mute)}
.weekl{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;text-align:center}
.axes{display:flex;flex-direction:column;gap:6px;font-size:var(--t2)}
.axes>div{display:grid;grid-template-columns:96px 1fr 38px;gap:10px;align-items:center;white-space:nowrap}
.axes b{height:6px;border:1px solid var(--rule);position:relative;display:block}
.axes b i{position:absolute;inset:0 auto 0 0;background:var(--fg)}
.axes .v{text-align:right}
.empty{font-size:var(--t2);color:var(--mute)}

/* ---- SITTING ---- */
.sitbar{display:flex;justify-content:space-between;align-items:center;padding:12px 24px;border-bottom:1px solid var(--rule);font-size:var(--t2)}
.drill{flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);max-width:1240px;width:100%;margin:0 auto}
.drill.one{grid-template-columns:minmax(0,600px);justify-content:center}
.pane{padding:56px 40px;display:flex;flex-direction:column;gap:16px;min-width:0}
.pane.left{border-right:1px solid var(--rule)}
.drill.one .pane.left{display:none}
.ask{font:400 var(--t5)/1.2 var(--display)}
.answer{display:flex;gap:12px;align-items:center}
.answer input{flex:0 1 340px;min-width:0;background:var(--panel);border:1px solid var(--rule);padding:8px 12px;font:400 var(--t5)/1.2 var(--form);border-radius:0}
.verdict{min-height:64px}
.verdict .big{font:400 var(--t5)/1.2 var(--form)}
.verdict.ok .big{color:var(--good)} .verdict.no .big{color:var(--bad)}
.after{display:flex;gap:12px;flex-wrap:wrap}
.col{width:100%;max-width:680px;margin:0 auto;padding:56px 16px;display:flex;flex-direction:column;gap:16px}
.col.wide{max-width:960px}
.colfoot{display:flex;justify-content:space-between;align-items:center;gap:16px;white-space:nowrap}
.tabs{display:flex;gap:24px;border-bottom:1px solid var(--rule)}
.tabs button{background:none;border:0;padding:8px 0;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;color:var(--mute)}
.tabs button[aria-pressed=true]{color:var(--fg);border-color:var(--fg)}
.set{display:grid;grid-template-columns:1fr auto;gap:14px 24px;align-items:center}
.set input[type=number]{width:72px;background:var(--panel);border:1px solid var(--rule);padding:4px 8px;text-align:right}
.set .help{grid-column:1/-1;font-size:var(--t2);color:var(--mute);margin-top:-10px}
.search{background:var(--panel);border:1px solid var(--rule);padding:8px 12px;font:400 var(--t4)/1.4 var(--form);width:100%}
.days{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
.days i{aspect-ratio:1;border:1px solid var(--rule);cursor:pointer;position:relative}
.days i b{position:absolute;inset:0;background:var(--fg);opacity:var(--o,0)}
.days i.sel{outline:2px solid var(--fg);outline-offset:1px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--act);color:var(--actfg);padding:8px 16px;border-radius:3px;font-size:var(--t2)}

@media (max-width:1100px){.rail{display:none}.homewrap{padding:0 16px}.home{flex:1 1 auto;max-width:600px}}
@media (max-width:760px){
  .drill{grid-template-columns:1fr}.pane{padding:24px 16px}.pane.left{border-right:0;border-bottom:1px solid var(--rule);order:2}
  .col{padding:24px 16px}.ask{font-size:24px}.answer input{font-size:24px}
}
</style>
</head>
<body>
<div id="app"><div class="col"><span class="lab">Cotidie</span></div></div>

<script src="data/latin-paradigms.js?v=202609210"></script>
<script src="data/latin-vocab.js?v=202609210"></script>
<script src="data/greek-paradigms.js?v=202609210"></script>
<script src="data/greek-vocab.js?v=202609210"></script>
<script src="js/engine.js?v=202609210"></script>
<script src="js/store.js?v=202609210"></script>
<script src="js/fsrs.js?v=202609210"></script>
<script src="js/stats.js?v=202609210"></script>
<script src="js/time.js?v=202609210"></script>
<script src="js/tables.js?v=202609210"></script>
<script src="js/rail.js?v=202609210"></script>
<script src="js/changes.js?v=202609210"></script>
<script src="js/sync.js?v=202609210"></script>
<script src="js/greek.js?v=202609210"></script>
<script src="js/greek-input.js?v=202609210"></script>
<script>
/* ======================================================================
   The page. Everything that decides anything lives in js/*.js and is tested
   there; this file draws screens and wires keys.
   ====================================================================== */
const LANGS = {
  latin: { id:'latin', name:'Latin', key:STORE_KEYS.latin, table:LATIN_PARADIGMS, vocab:LATIN_VOCAB,
           cat:CATEGORY_LABELS, cell:CELL_LABELS,
           judge:(table, entry, category, cell, forms, input) => ({ correct:checkAnswer(input, forms.accepted), typoForgiven:false, isSibling:false }),
           norm:s => normalize(s), expand:null },
  greek: { id:'greek', name:'Greek', key:STORE_KEYS.greek, table:GREEK_PARADIGMS, vocab:GREEK_VOCAB,
           cat:GREEK_CATEGORY_LABELS, cell:GREEK_CELL_LABELS,
           judge:(table, entry, category, cell, forms, input, opts) => judgeTypedAnswer(table, entry, category, cell, forms, input, opts),
           norm:s => normalizeGreek(s, gradeOpts()), expand:expandMovableNu }
};
const UI_KEY = 'cotidie.ui.v1';
let ui = { lang:'greek', theme:'slate', panes:'two', axis:'tense' };
try { Object.assign(ui, JSON.parse(localStorage.getItem(UI_KEY) || '{}')); } catch(e){}
function saveUi(){ try { localStorage.setItem(UI_KEY, JSON.stringify(ui)); } catch(e){} }

const stores = { latin:defaultStore(), greek:defaultStore() };
let L = LANGS[ui.lang] || LANGS.greek;
const S = () => stores[L.id];
const otherStore = () => stores[L.id === 'greek' ? 'latin' : 'greek'];
function gradeOpts(){ return { accents: !!stores.greek.settings.requireAccents }; }
// ---- saving, and the push that follows it ----
// Every save schedules a push six seconds after the last one, per language,
// exactly as the old pages did; the push looks at the server first (see
// guardedAutoPush). Closing or hiding the page flushes whatever is pending.
const sync = { latin:{ syncedLen:null, remoteAt:null, timer:null }, greek:{ syncedLen:null, remoteAt:null, timer:null } };
const syncCode = () => loadSyncCode().syncCode || '';
function save(id){
  id = id || L.id;
  persistStore(LANGS[id].key, stores[id]);
  if (!syncCode()) return;
  const y = sync[id]; clearTimeout(y.timer);
  y.timer = setTimeout(() => { y.timer = null; guardedAutoPush(id); }, 6000);
}
function saveBoth(){ save('latin'); save('greek'); }
function flushPendingPush(){ ['latin','greek'].forEach(id => { const y = sync[id]; if (y.timer){ clearTimeout(y.timer); y.timer = null; doPush(id, true); } }); }
const rowsOf = st => st.log.length + ((st.tlog || []).length);
function noteSync(id, text, extra){ saveSyncStatus(id, Object.assign({ at:Date.now(), note:text, from:'' }, extra || {})); }
async function doPush(id, quiet){
  const st = stores[id], res = await pushStore(st, syncCode(), id);
  if (res.ok){
    sync[id].syncedLen = rowsOf(st); if (Number.isFinite(res.now)) sync[id].remoteAt = res.now;
    const facts = { pushedLogLen: rowsOf(st), bytes: res.bytes || 0, error:'', by: installId() };
    if (quiet) saveSyncStatus(id, Object.assign({ at:Date.now() }, facts)); else noteSync(id, 'Pushed', facts);
  } else noteSync(id, 'Push failed (' + res.error + ')', { error: res.error || 'failed' });
  if (view.screen === 'settings' || view.screen === 'home') render();
  return res;
}
async function applyMerge(id, res){
  const key = LANGS[id].key;
  saveLocalSpare(key, stores[id], 'a merge', installId());
  const m = mergeStores(stores[id], adoptStore(res.store));
  stores[id] = adoptStore(m.store); applyDefaults(stores[id], id === 'greek');
  storeReplaced(key); persistStore(key, stores[id]);
  sync[id].syncedLen = rowsOf(stores[id]); if (Number.isFinite(res.at)) sync[id].remoteAt = res.at;
  noteSync(id, mergeSummary(m.stats), { from: res.from || '' });
  if (m.stats.fromLocal > 0 || m.stats.tablesFromLocal > 0 || m.stats.cardsFromLocal > 0 || m.stats.prefsFrom === 'local') await doPush(id, true);
  return m;
}
async function doPull(id){
  const res = await fetchStore(syncCode(), id);
  if (!res.ok){ if (res.missing) return doPush(id); noteSync(id, 'Pull failed (' + res.error + ')', { error: res.error || 'failed' }); render(); return res; }
  await applyMerge(id, res); render(); return res;
}
let lastLaunchSync = 0;
async function syncOnLaunch(){
  if (!syncCode() || Date.now() - lastLaunchSync < 60000) return;
  lastLaunchSync = Date.now();
  for (const id of ['latin','greek']){
    const before = rowsOf(stores[id]), res = await fetchStore(syncCode(), id);
    if (!res.ok || rowsOf(stores[id]) !== before) continue;
    try { await applyMerge(id, res); } catch(e){ console.error('launch merge failed', e); }
  }
  if (view.screen === 'home' || view.screen === 'settings') render();
}
async function guardedAutoPush(id){
  if (!syncCode()) return;
  if (sync[id].syncedLen == null) return doPush(id, true);
  const inc = await fetchStore(syncCode(), id);
  if (pushRaceDecision(inc, sync[id].remoteAt) === 'merge-first'){
    try { await applyMerge(id, inc); if (view.screen === 'home') render(); return; } catch(e){ console.error('race-guard merge failed, pushing anyway', e); }
  }
  return doPush(id, true);
}
async function restoreFrom(id, which){
  const key = LANGS[id].key; let src, label;
  if (which === 'server'){
    if (!syncCode()){ noteSync(id, 'No sync code on this device'); render(); return; }
    const res = await fetchPrevStore(syncCode(), id);
    if (!res.ok){ noteSync(id, res.missing ? 'No spare on the server yet — one is kept the first time a second device pushes' : 'Could not read the spare (' + res.error + ')'); render(); return; }
    src = res.store; label = 'From the server’s spare: ';
  } else {
    const rec = await readLocalSpare(key);
    if (!rec || !rec.state){ noteSync(id, 'No spare on this device yet — one is kept the first time a sync replaces this copy'); render(); return; }
    src = rec.state; label = 'From this device’s spare: ';
  }
  saveLocalSpare(key, stores[id], 'a restore', installId());
  const m = mergeStores(stores[id], adoptStore(src));
  stores[id] = adoptStore(m.store); applyDefaults(stores[id], id === 'greek');
  storeReplaced(key); persistStore(key, stores[id]); sync[id].syncedLen = rowsOf(stores[id]);
  noteSync(id, label + mergeSummary(m.stats));
  if (m.stats.fromRemote || m.stats.tablesFromRemote) await doPush(id, true);
  render();
}
function newSyncCode(){
  if (syncCode() && !confirm(syncCodeReplaceMessage())) return;
  saveSyncCode(randomSyncCode()); ['latin','greek'].forEach(id => noteSync(id, 'Code created — enter it on your other device to link them'));
  render(); doPush('latin', true); doPush('greek', true);
}
function setSyncCode(v){
  v = String(v || '').trim(); if (!v) return;
  if (syncCode() && v !== syncCode() && !confirm(syncCodeReplaceMessage())) return;
  saveSyncCode(v); render(); doPull('latin'); doPull('greek');
}
// ---- the mark: one dot that says whether this device's copy is safe ----
function syncMarkState(id){
  if (!syncCode()) return { kind:'off', waiting:0 };
  const st = loadSyncStatus(id), waiting = Math.max(rowsOf(stores[id]) - (st.pushedLogLen | 0), 0);
  if (st.error) return { kind:'failed', waiting, note: st.note };
  const age = st.at ? Date.now() - st.at : null;
  return { kind: age == null ? 'never' : age < 3600000 ? 'fresh' : age < FSRS_DAY ? 'aging' : 'old', waiting, at: st.at, note: st.note };
}
function syncMarkHtml(){
  const a = syncMarkState('latin'), b = syncMarkState('greek');
  const worst = ['off','failed','never','old','aging','fresh'].find(k => a.kind === k || b.kind === k);
  const waiting = a.waiting + b.waiting;
  const col = { fresh:'var(--good)', aging:'var(--mute)', old:'var(--bad)', never:'var(--mute)', failed:'var(--bad)', off:'var(--rule)' }[worst];
  const r = 3 + Math.min(waiting / 150, 1) * 3;
  const title = worst === 'off' ? 'Sync is not set up' : worst === 'failed' ? 'The last sync failed' : (waiting ? waiting + ' answers not yet on the server' : 'Everything is on the server');
  return `<button class="mark-sync" data-act="syncnow" title="${esc(title)}" aria-label="${esc(title)}"><svg width="18" height="18" viewBox="0 0 18 18"><circle cx="9" cy="9" r="6.5" fill="none" stroke="${col}" stroke-width="1.5" ${worst === 'off' ? 'stroke-dasharray="2 2"' : ''}/>${worst === 'failed' ? `<path d="M6 6l6 6M12 6l-6 6" stroke="${col}" stroke-width="1.5"/>` : waiting && worst !== 'off' ? `<circle cx="9" cy="9" r="${r}" fill="${col}"/>` : ''}</svg></button>`;
}
function syncNow(){
  if (!syncCode()){ go('settings'); return; }
  toast('Syncing…'); Promise.all(['latin','greek'].map(id => doPull(id))).then(() => { toast('Synced'); });
}
window.addEventListener('pagehide', flushPendingPush);
document.addEventListener('visibilitychange', () => { if (document.hidden) flushPendingPush(); else if (view.screen === 'home') syncOnLaunch(); });

function applyDefaults(st, greek){
  if (greek){
    if (st.settings.requireAccents === undefined) st.settings.requireAccents = false;
    if (st.settings.hopliteInput === undefined) st.settings.hopliteInput = true;
  }
  if (st.settings.revealOld === undefined) st.settings.revealOld = true;
  if (st.settings.carryStem === undefined) st.settings.carryStem = true;
  commitRollover(st.settings, Date.now());
}

const app = document.getElementById('app');
const esc = escHtml;
const $ = s => app.querySelector(s), $$ = s => [...app.querySelectorAll(s)];
function ago(t){ const m = (Date.now() - t) / 60000; return m < 1.5 ? 'just now' : m < 90 ? Math.round(m) + ' min ago' : m < 36*60 ? Math.round(m / 60) + ' h ago' : Math.round(m / 1440) + ' days ago'; }
const fmtMin = ms => { const m = ms / 60000; return m < 10 ? (Math.round(m * 10) / 10).toString() : String(Math.round(m)); };
const kbd = k => `<kbd>${k}</kbd>`;
let view = { screen:'home' };
let sit = null;
let toastTimer = null;
function toast(text){
  let t = document.querySelector('.toast'); if (!t){ t = document.createElement('div'); t.className = 'toast'; document.body.appendChild(t); }
  t.textContent = text; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2600);
}

// ---------------------------------------------------------------- labels --
const GENDER = { m:'Masculine', f:'Feminine', n:'Neuter', mf:'Masculine / feminine' };
const catLabel = c => L.cat[c] || String(c);
function cellLabelOf(category, cell){
  const one = L.cell[cell];
  return (!one || one === '—') ? catLabel(category) : catLabel(category) + ' · ' + one;
}
function subLabel(t){
  const cls = L.table[t.classKey];
  if (cls.kind === 'adj') return GENDER[t.sub] || t.sub;
  if (t.sub === 'inf') return 'Infinitives';
  if (t.sub) return catLabel(t.sub);
  return t.classKey.indexOf('pp_') === 0 ? 'Principal parts' : (cls.kind === 'noun' ? (cls.label || '') : '');
}
const wordHtml = e => `<span class="form">${esc(e.lemma)}</span>`;
function tableTitleHtml(t, entry){
  const s = subLabel(t);
  return wordHtml(entry) + ' · ' + esc(entry.meaning || '') + (s ? ' · ' + esc(s) : '');
}
const tableByKey = () => { const m = {}; tablesOf(L.table).forEach(t => { m[t.key] = t; }); return m; };
function tableOfCell(entry, category, cell){
  const cls = L.table[entry.class];
  return tableByKey()[TABLE_PREFIX + entry.class + '|' + tableSubOf(cls, entry.class, category, cell)];
}

// ------------------------------------------------------------- the grid --
// Lays a table's cells out the way it is printed: persons down and numbers
// across for one tense; cases down and numbers across for a noun or one
// gender; one column for infinitives and principal parts. `fill(c, i)`
// returns {html, cls} for each cell; i is the recitation order, which is
// column-major and is therefore also the Tab order.
function gridHtml(t, entry, fill){
  const cells = tableCellsFor(entry, t);
  const person = cells.every(c => /^[123](sg|pl)$/.test(c.cell)) && new Set(cells.map(c => c.category)).size === 1;
  let rows, cols, at;
  if (person){
    rows = ['1','2','3'].filter(p => cells.some(c => c.cell[0] === p));
    cols = ['sg','pl'].filter(n => cells.some(c => c.cell.slice(1) === n));
    at = (r, k) => cells.findIndex(c => c.cell === r + k);
  } else {
    rows = [...new Set(cells.map(c => c.category))];
    cols = [...new Set(cells.map(c => c.cell))];
    at = (r, k) => cells.findIndex(c => c.category === r && c.cell === k);
  }
  const rowLab = r => person ? ({ '1':'1st', '2':'2nd', '3':'3rd' })[r] : catLabel(r);
  const colLab = k => person ? (k === 'sg' ? 'Singular' : 'Plural')
    : String(L.cell[k] || k).replace(/^(Masculine|Feminine|Neuter|Masc\.\/Fem\.) /, '').replace('—', '');
  const head = cols.length > 1 ? `<thead><tr><th></th>${cols.map(k => `<th>${esc(colLab(k))}</th>`).join('')}</tr></thead>` : '';
  return `<table class="grid">${head}<tbody>` + rows.map(r => `<tr><th>${esc(rowLab(r))}</th>` + cols.map(k => {
    const i = at(r, k);
    if (i < 0) return '<td class="none"></td>';
    const f = fill(cells[i], i) || {};
    return `<td class="${f.cls || ''}" data-i="${i}">${f.html || ''}</td>`;
  }).join('') + '</tr>').join('') + '</tbody></table>';
}
const formOf = (entry, c) => formsFor(L.table, entry, c.category, c.cell);

const GROUPS = {
  greek: [['Pronouns', t => /^(article|pron_|rel_|num_)/.test(t.classKey)],
          ['Adjectives', t => /^(adj_|cmp_)/.test(t.classKey)],
          ['Nouns', t => /^decl/.test(t.classKey)],
          ['Participles', t => /^part_/.test(t.classKey)],
          ['Princ. parts', t => /^pp_/.test(t.classKey)],
          ['Indicative', t => !/\.(subj|opt|imper)$/.test(t.sub) && t.sub !== 'inf'],
          ['Subj · opt', t => /\.(subj|opt)$/.test(t.sub)],
          ['Imper · infin', t => true]],
  latin: [['Nouns', t => /^decl/.test(t.classKey)],
          ['Active', t => /^conj/.test(t.classKey) && /\.act$/.test(t.sub)],
          ['Passive', t => /^conj/.test(t.classKey)],
          ['Irregular', t => true]]
};
const GROUP_ORDER = { greek:['Pronouns','Adjectives','Nouns','Indicative','Subj · opt','Imper · infin','Participles','Princ. parts'],
                      latin:['Nouns','Active','Passive','Irregular'] };
function groupedTables(){
  const by = {}; GROUP_ORDER[L.id].forEach(g => { by[g] = []; });
  rankedTables(L.table).forEach(t => {
    if (!tableWords(L.vocab, t).length) return;
    const g = GROUPS[L.id].find(x => x[1](t)); by[g[0]].push(t);
  });
  return GROUP_ORDER[L.id].map(g => [g, by[g]]);
}
const isCore = t => tableRank(t) <= 5;
function dateLabel(dayK){
  const d = new Date(dayStart(dayK, effRollover(S().settings, Date.now())) + 12*FSRS_HOUR);
  return d.getDate() + ' ' + ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()];
}

  return `<div class="row" style="font-size:var(--t2)"><span class="mute">${n} answers are not on the server yet.</span><a data-act="syncnow">Sync now</a></div>`;

function weekHtml(now){

// --------------------------------------------------------------- SITTING --
function startSitting(queue){
  const now = Date.now();
  if (!queue && limitReached(S(), now, otherStore())){ extendToday(S(), now); save(); }
  sit = { n:0, queue: queue || null, startUsed: usedTodayMs(S(), now, otherStore()) };
  view = { screen:'sit' }; nextTurn();
}
function nextTurn(){
  const now = Date.now();
  let item;
  if (sit.queue) item = sit.queue.length ? { type:'cell', item: sit.queue.shift() } : null;
  else item = nextItem(S(), L.vocab, L.table, now, null, otherStore());
  sit.cur = item; sit.phase = 'ask'; sit.shownAt = now; sit.firstKeyAt = null; sit.keys = 0; sit.pending = null;
  render();
}
function sitBarHtml(){
  const used = usedTodayMs(S(), Date.now(), otherStore());
  return `<div class="sitbar"><span class="v">${sit.n} answered · ${fmtMin(Math.max(used - sit.startUsed, 0))} min this sitting${limitOn(S()) ? ' · ' + fmtMin(used) + ' of ' + fmtMin(budgetTodayMs(S(), Date.now(), otherStore())) + ' today' : ''}</span><a class="mute" data-act="home">Leave${kbd('esc')}</a></div>`;
}
function answeredToday(){
  const st = S(), now = Date.now(), roll = effRollover(st.settings, now), today = dayKey(now, roll), set = new Set();
  for (let i = st.log.length - 1; i >= 0 && dayKey(st.log[i].ts, roll) === today; i--) set.add(st.log[i].cardId);
  const byKey = tableByKey();
  (st.tlog || []).forEach(r => { if (dayKey(r.ts, roll) !== today || !byKey[r.table]) return;
    byKey[r.table].cells.forEach(c => set.add(cardId(r.word, c.category, c.cell))); });
  return set;
}
function renderSit(){
  const cur = sit.cur;
  if (!cur || cur.type === 'limit'){
    const lim = cur && cur.type === 'limit';
    app.innerHTML = sitBarHtml() + `<main class="col"><span class="lab">${lim ? 'Today’s minutes are spent' : 'Nothing left'}</span>
      <div class="ask">${lim ? 'That is the day.' : 'Everything due is done.'}</div>
      <p class="mute">${lim ? 'Anything still waiting keeps until tomorrow. Nothing is lost by stopping here.' : sit.queue ? 'That was the whole list.' : 'Every table has been met and nothing is due.'}</p>
      <div class="after"><button class="btn" data-act="home">Home${kbd('↵')}</button>${lim ? `<button class="btn quiet" data-act="more">Five more minutes${kbd('M')}</button>` : ''}</div></main>`;
    return;
  }
  if (cur.type === 'cell') return renderCell();
  return cur.mode === 'reveal' ? renderReveal() : renderTyped();
}

// ---- one form, asked cold ----
function renderCell(){
  const { item } = sit.cur, entry = item.entry, t = tableOfCell(entry, item.category, item.cell);
  const done = sit.phase === 'verdict', today = done ? null : answeredToday(), p = sit.pending;
  const forms = formsFor(L.table, entry, item.category, item.cell);
  const grid = t ? gridHtml(t, entry, c => {
    const me = c.category === item.category && c.cell === item.cell;
    const show = done || (!me && today.has(cardId(entry.id, c.category, c.cell)));
    return { html: show ? esc(formOf(entry, c).primary) : '', cls: me ? 'now' + (done ? (p.correct ? ' ok' : ' no') : '') : '' };
  }) : '';
  const title = t ? `<span class="lab">${tableTitleHtml(t, entry)}</span>` : '';
  let verdict = '';
  if (done){
    const prev = schedule(S().cards[cardId(entry.id, item.category, item.cell)] || freshCard(), p.correct ? GOOD : AGAIN, Date.now(), S().settings);
    const line = p.correct ? (p.typoForgiven ? 'Right — a slip of one letter, forgiven' : 'Right') :
      p.isSibling ? 'That is a different form of this word' : (p.typed ? 'You typed ' + p.typed : 'Left blank');
    verdict = `<div class="verdict ${p.correct ? 'ok' : 'no'}"><div class="big">${esc(forms.primary)}</div><div class="mute">${esc(line)} · back ${esc(backIn(prev.ivl))}</div></div>
      <div class="after"><button class="btn" data-act="next">Next${kbd('↵')}</button>
      ${(!p.correct && !p.isSibling && p.typed) ? `<button class="btn quiet" data-act="typo">It was a typo${kbd('Y')}</button>` : ''}
      <button class="btn quiet" data-act="flag">${isFlagged(S(), cardId(entry.id, item.category, item.cell)) ? 'Unflag' : 'Flag'}${kbd('F')}</button></div>`;
  }
  app.innerHTML = sitBarHtml() + `<div class="drill ${ui.panes === 'one' ? 'one' : ''}">
    <div class="pane left">${title}${grid}${done ? '' : '<span class="mute" style="font-size:var(--t2)">Only forms you have already answered today are filled in.</span>'}</div>
    <div class="pane"><span class="lab">${wordHtml(entry)} · ${esc(entry.meaning || '')}</span>
      <div class="ask">${esc(cellLabelOf(item.category, item.cell))}</div>
      <div class="answer"><input id="ans" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Your answer" ${done ? 'disabled value="' + esc(p.typed) + '"' : ''}>
        ${done ? '' : `<button class="btn" data-act="check">Check${kbd('↵')}</button>`}</div>
      ${verdict}${done && ui.panes === 'one' ? grid : ''}</div></div>`;
  if (!done) wireInput($('#ans'));
}
// What to say about a table that has just gone right. A retired one is not
// "back in 1217 months" -- it is not coming back, and the reason it is not is
// worth saying once, where he can see it.
function retiredLine(t, ivl){
  const c = S().cards[t.key];
  if (!c || !c.ret) return 'All right · back ' + backIn(ivl);
  return 'All right · retired — you typed the whole of it cold'
    + (c.aud ? ', with one check-up ' + backIn(c.due - Date.now()) : '');
}
function backIn(ms){
  if (ms < 90 * 60000) return 'in ' + Math.max(Math.round(ms / 60000), 1) + ' min';
  const now = Date.now(), roll = effRollover(S().settings, now), d = dayKey(now + ms, roll) - dayKey(now, roll);   // study days, as the scheduler counts them
  return d <= 1 ? 'tomorrow' : d < 60 ? 'in ' + d + ' days' : 'in ' + Math.round(d / 30) + ' months';
}
function wireInput(inp){
  inp.focus();
  if (L.id === 'greek'){ const h = attachHopliteInput(inp); if (!S().settings.hopliteInput) h.disable(); }
  inp.addEventListener('keydown', e => { if (e.key.length === 1 || e.key === 'Backspace'){ sit.keys++; if (sit.firstKeyAt == null) sit.firstKeyAt = Date.now(); } });
}
function checkCell(){
  const { item } = sit.cur, inp = $('#ans'), forms = formsFor(L.table, item.entry, item.category, item.cell);
  const j = L.judge(L.table, item.entry, item.category, item.cell, forms, inp.value, gradeOpts());
  const now = Date.now();
  let fl = 0; if (L.id === 'greek'){ if (S().settings.requireAccents) fl |= FL_ACCENTS; if (S().settings.hopliteInput) fl |= FL_SCHEME; }
  try { if (matchMedia('(pointer: coarse)').matches) fl |= FL_TOUCH; } catch(e){}
  const timing = { keys:sit.keys, flags:fl };
  if (sit.firstKeyAt != null){ timing.toFirstKey = sit.firstKeyAt - sit.shownAt; timing.typing = now - sit.firstKeyAt; }
  sit.pending = Object.assign({ typed: inp.value.trim(), latency: now - sit.shownAt, timing, at: now }, j);
  sit.phase = 'verdict'; render();
}
// The answer is written when he moves on, not when it is judged, so "it was a
// typo" can still change what is recorded -- the store has no undo and this
// way does not need one. Leaving mid-verdict commits it as judged.
function commitCell(){
  const p = sit.pending; if (!p || sit.cur.type !== 'cell') return;
  const { item } = sit.cur;
  recordReview(S(), { wordId:item.entry.id, category:item.category, cell:item.cell, lemma:item.entry.lemma }, p.correct, p.latency, p.at, p.timing);
  afterCellReview(S(), cardId(item.entry.id, item.category, item.cell));
  sit.pending = null; sit.n++; save();
}

// ---- a whole table, typed ----
function renderTyped(){
  const { t, entry, first } = sit.cur, done = sit.phase === 'verdict', res = sit.results;
  const cells = tableCellsFor(entry, t);
  const grid = gridHtml(t, entry, (c, i) => {
    if (!done) return { html:`<input tabindex="${i + 1}" data-i="${i}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="${esc(cellLabelOf(c.category, c.cell))}">` };
    const r = res[i], f = formOf(entry, c).primary;
    return { cls: r.correct ? 'ok' : 'no', html: esc(f) + (r.correct ? '' : `<small>${r.typed ? 'you: ' + esc(r.typed) : 'blank'}</small>`) };
  });
  const miss = done ? res.filter(r => !r.correct).length : 0;
  app.innerHTML = sitBarHtml() + `<main class="col"><span class="lab">${first ? 'New table' : 'Table returning'} · ${cells.length} forms</span>
    <div class="ask">${tableTitleHtml(t, entry)}</div>${grid}
    <div class="colfoot"><span class="mute">${!done ? (S().settings.carryStem !== false
        ? 'Tab moves down each column; a box you have not reached starts with what your answers so far share, so trim it or type on. Leave blank what you do not know.'
        : 'Tab moves down each column. Leave blank what you do not know.') :
      miss ? (cells.length - miss) + ' right · ' + miss + ' to drill alone · table back ' + backIn(sit.lastIvl) : retiredLine(t, sit.lastIvl)}</span>
      <span class="after">${done && sit.undo ? `<button class="btn quiet" data-act="untable">Undo${kbd('U')}</button>` : ''}
      <button class="btn" data-act="${done ? 'next' : 'checktable'}">${done ? 'Next' : 'Check table'}${kbd('↵')}</button></span></div></main>`;
  if (!done){
    const ins = $$('.grid input');
    wireTable(ins, cells);
    const firstIn = ins.find(i => i.dataset.i === '0'); if (firstIn) firstIn.focus();
  } else $('[data-act=next]').focus();
}
/* ---- carrying his own typing forward (2026-09-21) --------------------------
   He types the stem of the word again in every cell of a table, which teaches
   nothing about the declension: it is 58% of every Latin keystroke and 44% of
   every Greek one. So every box he has not yet typed in starts with the
   longest run of letters common to the answers he HAS already given in this
   table.

   Built from his own keystrokes and never from the answer key, which is the
   whole point. Filling in the stem the app knows would be cheaper still, but
   on every imperfect, future, aorist, perfect and optative table the shared
   stem IS the tense stem -- 419 of Greek's 975 tables -- and that is the half
   of the answer those tables exist to ask for. Nothing here can show him a
   letter he did not write himself.

   Two details that are easy to get wrong. Tab into a box that already holds a
   carried stem SELECTS its text, so the next key would replace it rather than
   continue it -- hence the caret guard, registered before the Greek input
   handler so the caret is already right by the time that one reads it. And a
   box stops being refilled the moment he touches it, so nothing he has typed
   is ever overwritten by a later answer shortening the shared run.

   Timing is taken from the keystrokes, not from focus events, which do not
   fire in a window that is not frontmost.
   -------------------------------------------------------------------------*/
function wireTable(ins, cells){
  const carry = S().settings.carryStem !== false;
  const track = {};
  cells.forEach((c, i) => { track[i] = { keys:0, pre:0, touched:false, first:null, last:null }; });
  sit.typing = { track, redone:false };

  // sharedPrefix lives in js/tables.js: pure, and therefore tested. A run of
  // one character is not carried: it saves a single key and, on exactly the
  // tables where one letter is all the forms share, it is usually WRONG --
  // the article's ὁ against τόν. 38 Greek tables and one Latin one have a
  // one-letter run, so the cost of the rule is about 0.7% of the saving.
  const carried = () => {
    const p = sharedPrefix(ins.filter(el => track[el.dataset.i].touched).map(el => el.value));
    return [...p].length < 2 ? '' : p;
  };
  function spread(){
    if (!carry) return;
    const p = carried();
    ins.forEach(el => {
      const t = track[el.dataset.i]; if (t.touched) return;
      el.value = p; el.classList.toggle('carried', !!p); t.pre = [...p].length;
    });
  }

  ins.forEach(inp => {
    const t = track[inp.dataset.i];
    inp.addEventListener('keydown', () => {
      if (!t.touched && inp.selectionStart !== inp.selectionEnd)
        inp.selectionStart = inp.selectionEnd = inp.value.length;
    });
    if (L.id === 'greek'){ const h = attachHopliteInput(inp); if (!S().settings.hopliteInput) h.disable(); }
    inp.addEventListener('keydown', e => {
      if (e.key === 'Tab' || e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.key.length !== 1 && e.key !== 'Backspace' && e.key !== 'Delete') return;
      const now = Date.now();
      // Backspace deletes ONE character, as it always has. It briefly did not:
      // it threw the whole carried run away, on the reasoning that rejecting a
      // wrong guess should cost one key. That optimised the wrong case. The
      // run overshoots on 1,293 Greek cells and 62 Latin ones, and the average
      // overshoot is 2.4 letters in Greek and 1.6 in Latin -- νεανίας to
      // νεανία, one letter off the end -- so TRIMMING is the normal case and
      // wholesale rejection is the tail. Trimming has to cost one key; the
      // tail can pay for itself (holding Backspace, or ⌘⌫, which clears the
      // box natively because this handler leaves modified keys alone).
      t.touched = true; t.keys++; if (t.first == null) t.first = now; t.last = now;
      inp.classList.remove('carried');
      setTimeout(spread, 0);
    });
    inp.addEventListener('focus', () => {
      if (t.touched) return;
      setTimeout(() => { try { inp.selectionStart = inp.selectionEnd = inp.value.length; } catch(err){} }, 0);
    });
    // an undo puts back what was typed, so one bad cell is one cell to fix.
    // Those cells count as his, and the table's typing is no longer a clean
    // measurement of one pass, so it is not recorded.
    const was = sit.cur.typed;
    if (was && was[inp.dataset.i]){ inp.value = was[inp.dataset.i]; t.touched = true; sit.typing.redone = true; }
  });
  spread();
}

// What one pass over a table cost, in the shape store.log keeps for a form
// asked on its own, so the two can be compared rather than assumed.
function tableTyping(){
  const tp = sit.typing;
  if (!tp || tp.redone) return null;
  let keys = 0, pre = 0, first = null, last = null;
  Object.keys(tp.track).forEach(k => {
    const r = tp.track[k];
    keys += r.keys; pre += r.pre;
    if (r.first != null && (first == null || r.first < first)) first = r.first;
    if (r.last  != null && (last  == null || r.last  > last )) last  = r.last;
  });
  if (!keys) return null;
  return { keys, pre,
           tfk: first == null ? null : Math.max(first - sit.shownAt, 0),
           typ: (first != null && last != null) ? (last - first) : null };
}

function checkTable(){
  const { t, entry } = sit.cur, cells = tableCellsFor(entry, t), now = Date.now();
  const typed = {}; $$('.grid input').forEach(i => { typed[i.dataset.i] = i.value; });
  sit.results = cells.map((c, i) => {
    const j = L.judge(L.table, entry, c.category, c.cell, formOf(entry, c), typed[i] || '', gradeOpts());
    return { category:c.category, cell:c.cell, correct:j.correct, typed:(typed[i] || '').trim() };
  });
  const r = recordTable(S(), t, entry, sit.results, now - sit.shownAt, now, { typing: tableTyping() });
  sit.lastIvl = r.ivl; sit.undo = r.undo; sit.cur.typed = typed;
  sit.n += cells.length; sit.phase = 'verdict'; save(); render();
}

}

/* ---- what's new -----------------------------------------------------------
   The user-facing half of the record. The full one is
   evergreen/BUILD_HISTORY.md, which nobody has to read; this is the one he
   does, so every entry says what a change gives him, how to use it and WHERE
   in the app it is.

   The rebuild of 17 September dropped this screen along with the old pages --
   js/changes.js was still loaded, but only for the build number, so for four
   days the app shipped a changelog it never showed. Put back 2026-09-21.

   Builds are grouped by day: five builds in one afternoon is a fact about the
   repository, not about what he can now do.
   -------------------------------------------------------------------------- */
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function changeDays(){
  const days = [];
  CHANGES.forEach(([v, lines]) => {
    const day = v.split('.').slice(0, 3).join('.');
    const last = days[days.length - 1];
    if (last && last.day === day){ last.lines = last.lines.concat(lines); last.builds.push(v); }
    else days.push({ day, builds:[v], lines: lines.slice() });
  });
  return days;
}
function dayTitle(day){
  const p = day.split('.');
  return (+p[2]) + ' ' + MONTHS[(+p[1]) - 1] + ' ' + p[0];
}
function renderChanges(){
  app.innerHTML = backBar('settings') + `<main class="col"><div class="ask">What’s new</div>
    ${changeDays().map(d => `<section class="sec" style="margin-top:20px">
      <div class="row"><span class="lab">${esc(dayTitle(d.day))}</span><span class="v mute">${esc(d.builds[0])}</span></div>
      <div class="news">${d.lines.map(t => '<p>' + t + '</p>').join('')}</div>
    </section>`).join('')}
    <span class="empty" style="margin-top:24px">Every build ever, in full, is in the repository — this is the short version, and the one worth reading.</span></main>`;
}

/* ---- the cold sheet ------------------------------------------------------
   Twenty-five forms drawn uniformly from everything he has met, typed in one
   go with no feedback until the end -- so that nothing he learns from item 3
   can change item 20, and so it takes five minutes rather than twenty.

   Nothing here touches store.log, store.cards, store.tlog or the day's
   minutes. Only the score is kept, in store.cold, which the scheduler never
   reads. The moment this feeds back into the schedule it stops being a
   measurement of it.
   -------------------------------------------------------------------------- */
const COLD_N = 25;
let cold = null;
function renderCold(){
  const done = cold.phase === 'done';
  const rows = cold.items.map((it, i) => {
    const want = formsFor(L.table, it.entry, it.category, it.cell).primary;
    const r = done ? cold.results[i] : null;
    return `<div class="row${done ? (r.correct ? ' ok' : ' no') : ''}">
      <span>${wordHtml(it.entry)} <span class="mute">${esc(cellLabelOf(it.category, it.cell))}</span></span>
      <span class="v">${done ? `<span class="form">${esc(want)}</span>${r.correct ? '' : ' <span class="mute">you: ' + (r.typed ? esc(r.typed) : 'blank') + '</span>'}`
        : `<input data-i="${i}" tabindex="${i + 1}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="${esc(cellLabelOf(it.category, it.cell))}">`}</span></div>`;
  }).join('');
  const right = done ? cold.results.filter(r => r.correct).length : 0;
  app.innerHTML = `<div class="sitbar"><a data-act="go" data-v="stats">← Back${kbd('esc')}</a><span class="mute">${L.name}</span></div>
    <main class="col"><span class="lab">Cold check · ${cold.items.length} forms drawn at random from everything you have met</span>
    <div class="ask">${done ? right + ' of ' + cold.items.length + ' · ' + Math.round(100 * right / cold.items.length) + '%' : 'Type what you can. Leave the rest blank.'}</div>
    <div class="list">${rows}</div>
    <div class="colfoot"><span class="mute">${done ? 'Not shaped by what the app chose to ask you — that is the point of it.' : 'None of this is recorded as a review, and none of it changes your schedule.'}</span>
      <button class="btn" data-act="${done ? 'coldsave' : 'coldmark'}">${done ? 'Done' : 'Mark the sheet'}${kbd('↵')}</button></div></main>`;
  if (!done){
    const ins = $$('.list input');
    ins.forEach(inp => { if (L.id === 'greek'){ const h = attachHopliteInput(inp); if (!S().settings.hopliteInput) h.disable(); } });
    if (ins[0]) ins[0].focus();
  }
}
function coldHistoryHtml(st){
  const list = Array.isArray(st.cold) ? st.cold.slice(-6).reverse() : [];
  if (!list.length) return '';
  return `<div class="list">${list.map(c => `<div class="row"><span class="mute">${esc(dateLabel(dayKey(c.ts, effRollover(st.settings, c.ts))))}</span><span class="v">${c.right} of ${c.n} · ${Math.round(100 * c.right / Math.max(c.n, 1))}%</span></div>`).join('')}</div>`;
}

// Measured recall: the one number that says whether a miss holding a table in
// place, and a table typed right first time retiring, were safe. Target is his
// own retention setting -- 90% by default -- read at the level the change was
// made at, which is the FORM, not the table.
function recallHtml(st){
  const r = tableRecall(st), want = Math.round(st.settings.retention * 100);
  const pc = x => Math.round(x * 100) + '%';
  const verdict = r.asked < 200 ? 'Too few returns yet to mean anything.'
    : r.rate >= st.settings.retention - 0.03 ? 'At or about your target — the schedule is holding.'
    : r.rate >= st.settings.retention - 0.08 ? 'A little under target. Worth watching; not yet worth changing.'
    : 'Well under target — the schedule is asking too late. Settings › target is the dial.';
  return `<section class="sec" style="margin-top:16px"><span class="lab">Measured recall · target ${want}%</span>
    <div class="list">
      <div class="row"><span>Forms you produce inside a table you have met before</span><span class="v">${r.rate == null ? '—' : pc(r.rate)}</span></div>
      <div class="row"><span class="mute">out of ${r.asked} form${r.asked === 1 ? '' : 's'}, over ${r.returns} return${r.returns === 1 ? '' : 's'}</span><span class="v mute">${r.right} right</span></div>
      ${r.held ? `<div class="row"><span class="mute">returns where a form was missed and the table kept its place</span><span class="v mute">${r.held}</span></div>` : ''}
      ${r.firsts ? `<div class="row"><span class="mute">tables typed entirely right the first time</span><span class="v mute">${r.firstPerfect} of ${r.firsts}</span></div>` : ''}
      ${r.retired ? `<div class="row"><span>Tables retired</span><span class="v">${r.retired}</span></div>` : ''}
      ${r.audits ? `<div class="row"><span>Retired tables audited later</span><span class="v">${r.auditsPassed} of ${r.audits} came back perfect${r.auditRate == null ? '' : ' · ' + pc(r.auditRate) + ' of forms'}</span></div>`
                 : (r.retired ? `<div class="row"><span class="mute">a quarter of them come back once, four months on, to check that retiring them was safe</span><span class="v mute">none due yet</span></div>` : '')}
    </div><span class="empty">${verdict}</span>
    <div class="row" style="margin-top:12px"><span class="mute">A cold check samples everything you have met — retired tables included — and is recorded nowhere the schedule can see it.</span>
      <span class="after"><button class="btn quiet small" data-act="cold" ${metForms(st, L.vocab, L.table).length < COLD_N ? 'disabled' : ''}>Take a cold check</button></span></div>
    ${coldHistoryHtml(st)}</section>`;
}

    <span class="empty">One code links your devices: get one here, type the same code on the other, and every answer reaches the server a few seconds later, encrypted with that code. Merging never loses a review.</span>
    <div class="set"><span>Code</span><span class="after"><input id="code" class="search" style="width:190px;font:inherit;padding:4px 8px" value="${esc(syncCode())}" autocomplete="off" spellcheck="false" placeholder="paste a code"><button class="btn quiet small" data-act="newcode">Get a code</button></span>
      ${['latin','greek'].map(id => { const st = loadSyncStatus(id); return `<span>${LANGS[id].name}</span><span class="mute" style="font-size:var(--t2);text-align:right">${st.at ? esc(st.note || 'Synced') + ' · ' + esc(ago(st.at)) : 'Not synced yet'}</span>`; }).join('')}
      <span>Now</span><span class="after"><button class="btn quiet small" data-act="pull" ${syncCode() ? '' : 'disabled'}>Pull and merge</button><button class="btn quiet small" data-act="push" ${syncCode() ? '' : 'disabled'}>Push</button></span>
      <span>Restore a spare</span><span class="after"><button class="btn quiet small" data-act="spare-server" ${syncCode() ? '' : 'disabled'}>the server’s</button><button class="btn quiet small" data-act="spare-local">this device’s</button></span>
      <span class="help">Both spares merge in rather than overwrite, so either can only add reviews back.</span></div></section>
    <section class="sec" style="margin-top:16px"><span class="lab">Backup file</span>
    <div class="after"><button class="btn quiet small" data-act="export">Save a backup file</button><label class="btn quiet small" style="cursor:pointer">Restore from a file<input type="file" id="restore" accept="application/json,.json" hidden></label></div>
    <span class="empty">A restored file is merged in, like a spare.</span></section>
    <div class="set" style="margin-top:16px"><span>What’s new</span><span class="after"><button class="btn quiet small" data-act="go" data-v="changes">Version 2026.09.21.0</button></span></div></main>`;
  $('#code').addEventListener('change', e => setSyncCode(e.target.value));
  $('#restore').addEventListener('change', async e => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    let parsed; try { parsed = JSON.parse(await f.text()); } catch(err){ toast('That file is not readable as a backup'); return; }
    const b = readBackup(parsed); if (!b.ok){ toast(b.error); return; }
    Object.keys(b.decks).forEach(id => { const key = LANGS[id].key; saveLocalSpare(key, stores[id], 'a restore', installId());
      const m = mergeStores(stores[id], adoptStore(b.decks[id])); stores[id] = adoptStore(m.store); applyDefaults(stores[id], id === 'greek');
      storeReplaced(key); persistStore(key, stores[id]); noteSync(id, 'From a file: ' + mergeSummary(m.stats)); if (syncCode()) doPush(id, true); });
    toast('Restored'); render();
  });
  $('#mins').addEventListener('change', e => { const v = Math.max(0, Math.min(240, e.target.value | 0));
    ['latin','greek'].forEach(id => { stores[id].settings.minutesPerDay = v; }); saveBoth(); toast(v ? v + ' minutes a day' : 'No daily limit'); });
}

// ---------------------------------------------------------------- wiring --
function render(){
  document.documentElement.dataset.id = ui.theme;
  ({ home:renderHome, sit:renderSit, tables:renderTables, lookup:renderLookup, stats:renderStats, settings:renderSettings, cold:renderCold, changes:renderChanges })[view.screen]();
}
function go(screen, extra){ view = Object.assign({ screen }, extra || {}); render(); window.scrollTo(0, 0); }
function leaveSitting(){ if (sit && sit.pending) commitCell(); sit = null; go('home'); }
function troubleQueue(){
  return troubleCells(S()).slice(0, 12).map(t => { const p = splitCardId(t.cardId), entry = p && L.vocab.find(e => e.id === p.wordId);
    return entry ? { wordId:entry.id, entry, category:p.category, cell:p.cell, card:S().cards[t.cardId] || null } : null; }).filter(Boolean);
}
const ACT = {
  lang: v => { L = LANGS[v]; ui.lang = v; saveUi(); render(); },
  start: () => startSitting(), trouble: () => { const q = troubleQueue(); if (q.length) startSitting(q); },
  go: v => go(v), home: () => leaveSitting(), axis: v => { ui.axis = v; saveUi(); render(); },
  table: v => go('tables', { table:v }), tab: v => { view.tab = v; render(); }, day: v => { view.day = +v; render(); },
  check: () => checkCell(), checktable: () => checkTable(),
  next: () => { if (sit.cur.type === 'cell') commitCell(); nextTurn(); },
  typo: () => { sit.pending.correct = true; sit.pending.typoForgiven = true; commitCell(); nextTurn(); },
  flag: () => { const i = sit.cur.item, id = cardId(i.entry.id, i.category, i.cell); setFlag(S(), id, !isFlagged(S(), id), Date.now()); save(); render(); },
  more: () => { extendToday(S(), Date.now()); save(); nextTurn(); },
  'rv-ok': () => gradeReveal(true), 'rv-miss': () => gradeReveal(false),
  // Undo, the one place there is one: checking a table writes eight forms on a
  // single keystroke. save() below also reschedules the pending push, so the
  // six-second window is restarted and the undone copy is what goes up.
  untable: () => {
    if (!sit || sit.phase !== 'verdict' || !sit.undo) return;
    const n = sit.undo.row.n;
    if (!undoTable(S(), sit.undo)){ toast('That check has already been merged with another device'); return; }
    sit.n = Math.max(0, sit.n - n); sit.undo = null; sit.lastIvl = null; sit.results = null;
    sit.phase = 'ask'; sit.shownAt = Date.now(); save(); render();
    toast('Taken back — the table is as it was');
  },
  // Start a table again: for a table he FLUKED, which the undo cannot reach
  // once its result has left the screen. Destructive, so it says in plain
  // words what goes and asks first -- the same confirm the sync code uses.
  forget: () => {
    const t = tableByKey()[view.table], st = S(), f = tableFootprint(st, t, L.vocab);
    const name = $('.ask') ? $('.ask').innerText.replace(/\s+/g, ' ').trim() : 'this table';
    const bits = [];
    if (f.rows) bits.push(f.rows === 1 ? 'the one time you have typed it' : 'the ' + f.rows + ' times you have typed it');
    if (f.ids.length) bits.push(f.ids.length === 1 ? 'the one form it is asking you on its own' : 'the ' + f.ids.length + ' forms it is asking you on their own');
    if (!confirm('Start ' + name + ' again?\n\nIt goes back to being a table you have not met'
      + (bits.length ? ', forgetting ' + bits.join(' and ') : '') + '.\n\nThe answers themselves stay in your history.')) return;
    forgetTable(st, t, L.vocab); save(); render();
    toast('Not met — it comes back as a new table');
  },
  cold: () => { cold = { items: coldSample(S(), L.vocab, L.table, COLD_N), results:null, phase:'ask', at:Date.now() };
    if (!cold.items.length){ cold = null; return; } go('cold'); },
  coldmark: () => {
    const typed = {}; $$('.list input').forEach(i => { typed[i.dataset.i] = i.value; });
    cold.results = cold.items.map((it, i) => {
      const forms = formsFor(L.table, it.entry, it.category, it.cell);
      const j = L.judge(L.table, it.entry, it.category, it.cell, forms, typed[i] || '', gradeOpts());
      return { correct:j.correct, typed:(typed[i] || '').trim() };
    });
    cold.phase = 'done'; render(); window.scrollTo(0, 0);
  },
  coldsave: () => {
    recordCold(S(), cold.items.length, cold.results.filter(r => r.correct).length, Date.now() - cold.at);
    cold = null; save(); go('stats'); toast('Kept as a measurement, not as a review');
  },
  peek: () => { const t = tableByKey()[view.table], e = tableWordFor(S(), L.vocab, t); $('.grid').outerHTML = gridHtml(t, e, x => ({ html: esc(formOf(e, x).primary) })); },
  typenow: () => { const t = tableByKey()[view.table]; sit = { n:0, queue:[], startUsed: usedTodayMs(S(), Date.now(), otherStore()) };
    sit.cur = { type:'table', t, entry:tableWordFor(S(), L.vocab, t), mode:'typed', first:!S().cards[t.key] }; sit.phase = 'ask'; sit.shownAt = Date.now(); view = { screen:'sit' }; render(); },
  syncnow: () => syncNow(), newcode: () => newSyncCode(),
  pull: () => { toast('Pulling…'); Promise.all(['latin','greek'].map(id => doPull(id))).then(render); },
  push: () => { toast('Pushing…'); Promise.all(['latin','greek'].map(id => doPush(id))).then(render); },
  'spare-server': () => { ['latin','greek'].forEach(id => restoreFrom(id, 'server')); }, 'spare-local': () => { ['latin','greek'].forEach(id => restoreFrom(id, 'local')); },
  export: () => { const blob = new Blob([JSON.stringify(buildBackup(stores))], { type:'application/json' }), a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'cotidie-backup-' + new Date().toISOString().slice(0, 10) + '.json'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000); },
  theme: v => { ui.theme = v; saveUi(); render(); }, panes: v => { ui.panes = v; saveUi(); render(); },
  retention: v => { ['latin','greek'].forEach(id => { stores[id].settings.retention = +v; }); saveBoth(); render(); },
  accents: v => { stores.greek.settings.requireAccents = v === 'true'; save('greek'); formIndex = {}; render(); },
  hoplite: v => { stores.greek.settings.hopliteInput = v === 'true'; save('greek'); render(); },
  carry: v => { ['latin','greek'].forEach(id => { stores[id].settings.carryStem = v === 'true'; }); saveBoth(); render(); }
};
ACT['reveal'] = v => { if (view.screen === 'settings'){ ['latin','greek'].forEach(id => { stores[id].settings.revealOld = v === 'true'; }); saveBoth(); render(); } else { sit.phase = 'verdict'; render(); } };
app.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (!el || el.disabled) return; const f = ACT[el.dataset.act]; if (f) f(el.dataset.v); });
app.addEventListener('mouseover', e => { const el = e.target.closest('.msq i'); if (!el) return; const t = tableByKey()[el.dataset.v], h = $('#maphint');
  if (t && h){ const w = tableWordFor(S(), L.vocab, t); h.innerHTML = tableTitleHtml(t, w); } });

document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const typing = /^(INPUT|SELECT|TEXTAREA)$/.test((e.target.tagName || ''));
  const k = e.key;
  if (k === 'Escape'){ e.preventDefault(); if (view.screen === 'sit') leaveSitting(); else if (view.screen === 'cold'){ cold = null; go('stats'); }
    else if (view.screen === 'tables' && view.table) go('tables'); else go('home'); return; }
  if (view.screen === 'sit' && sit && sit.cur){
    if (k === 'Enter'){ e.preventDefault();
      if (!sit.cur.type || sit.cur.type === 'limit') return leaveSitting();
      if (sit.cur.type === 'cell') return sit.phase === 'ask' ? checkCell() : ACT.next();
      if (sit.cur.mode === 'reveal') return sit.phase === 'ask' ? ACT.reveal() : gradeReveal(true);
      return sit.phase === 'ask' ? checkTable() : ACT.next(); }
    if (typing) return;
    const low = k.toLowerCase();
    if (sit.cur.type === 'limit' && low === 'm') return ACT.more();
    if (sit.cur.type === 'cell' && sit.phase === 'verdict'){ if (low === 'y' && $('[data-act=typo]')) return ACT.typo(); if (low === 'f') return ACT.flag(); }
    // preventDefault, or the u itself lands in the first box of the table the
    // undo has just put back and focused -- which it did, first time out.
    if (sit.cur.type === 'table' && sit.cur.mode !== 'reveal' && sit.phase === 'verdict' && low === 'u'){ e.preventDefault(); return ACT.untable(); }
    if (sit.cur.type === 'table' && sit.cur.mode === 'reveal'){ if (sit.phase === 'ask' && k === ' '){ e.preventDefault(); return ACT.reveal(); }
      if (sit.phase === 'verdict'){ if (k === '1') return gradeReveal(false); if (k === '2') return gradeReveal(true); } }
    return;
  }
  if (view.screen === 'sit'){ if (k === 'Enter') leaveSitting(); return; }
  if (view.screen === 'cold' && cold){ if (k === 'Enter'){ e.preventDefault(); return cold.phase === 'done' ? ACT.coldsave() : ACT.coldmark(); } return; }
  if (typing) return;
  if (view.screen === 'tables' && view.table && k === 'Enter'){ e.preventDefault(); return ACT.typenow(); }
  if (view.screen !== 'home') return;
  const low = k.toLowerCase();
  if (k === 'Enter'){ e.preventDefault(); const b = $('[data-act=start]'); if (b && !b.disabled) startSitting(); }
  else if (low === 'l') ACT.lang('latin'); else if (low === 'g') ACT.lang('greek');
  else if (low === 'b') go('tables'); else if (k === '/'){ e.preventDefault(); go('lookup'); }
  else if (low === 's') go('stats'); else if (k === ',') go('settings'); else if (low === 't') ACT.trouble();
});

(async function boot(){
  document.documentElement.dataset.id = ui.theme;
  stores.latin = await bootStore(LANGS.latin.key); stores.greek = await bootStore(LANGS.greek.key);
  applyDefaults(stores.latin, false); applyDefaults(stores.greek, true);
  // one limit for both: the language last changed wins, so they never disagree
  if (stores.latin.settings.minutesPerDay !== stores.greek.settings.minutesPerDay) stores.latin.settings.minutesPerDay = stores.greek.settings.minutesPerDay;
  render();
  syncOnLaunch();
})();
</script>
