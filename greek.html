<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self'; connect-src https://api.github.com https://*.githubusercontent.com; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>Cotidie — Greek</title>
<style>
:root{
  --serif:"Palatino","Palatino Linotype","Book Antiqua",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  --bg:#fbf7ec; --panel:#f5efdf; --ink:#2a2318; --muted:#6f6350; --faint:#988c75;
  --line:#e3d9c1; --coral:#8c2f26; --accent-soft:#f0e3d8; --raise:#fffdf6;
  --good:#5a6b32; --good-bg:#e6e5d4; --good-br:#c7cab0;
  --bad:#8c2f26; --bad-bg:#f3ded9; --bad-br:#dcb9ac;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#1a160f; --panel:#241f16; --ink:#ece3cf; --muted:#a89a80; --faint:#7a6f5c;
    --line:#3a3222; --coral:#d4795e; --accent-soft:#3f2a1f; --raise:#2c2519;
    --good:#a9bd72; --good-bg:#393b25; --good-br:#565c39;
    --bad:#d4795e; --bad-bg:#3f2a1f; --bad-br:#5c3a2c;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg)}
body{
  color:var(--ink); font-family:var(--sans); font-size:16px; line-height:1.6;
  -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%;
  padding:calc(20px + env(safe-area-inset-top)) 20px calc(40px + env(safe-area-inset-bottom));
  max-width:30rem; margin:0 auto;
}
h1{font-family:var(--serif);font-weight:400;font-size:1.7rem;margin:0 0 2px}
h2{font-family:var(--serif);font-weight:400;font-size:1.3rem;margin:0 0 2px}
.sub{color:var(--muted);font-size:14px;margin:0 0 22px}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:6px}
button.back{background:none;border:none;color:var(--muted);font-size:15px;padding:6px 0;cursor:pointer;font-family:var(--sans)}
button.back:active{color:var(--coral)}

a.card,button.card{display:block;width:100%;text-align:left;text-decoration:none;color:inherit;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px 18px;
  margin-bottom:10px;font-family:var(--sans);cursor:pointer}
a.card:active,button.card:active{border-color:var(--coral);background:var(--accent-soft)}
.card .t{font-family:var(--serif);font-size:1.15rem;margin-bottom:2px}
.card .d{color:var(--muted);font-size:13px}
.card.study{border-color:var(--good-br);background:var(--good-bg)}
.card.study .t{color:var(--good)}

.sect{margin-top:26px}
.sect h3{font-size:12px;font-weight:500;color:var(--faint);text-transform:uppercase;
  letter-spacing:.07em;margin:0 0 10px}

.tabs{display:flex;gap:6px;margin:16px 0}
.tabs button{flex:1;padding:9px 0;border:1px solid var(--line);background:var(--panel);
  color:var(--muted);border-radius:10px;font-family:var(--sans);font-size:14px;cursor:pointer}
.tabs button.on{background:var(--coral);border-color:var(--coral);color:var(--raise)}

table.para{width:100%;border-collapse:collapse;margin:14px 0 6px;font-family:var(--serif);font-size:1.02rem}
table.para th{text-align:left;color:var(--faint);font-family:var(--sans);font-size:11.5px;
  text-transform:uppercase;letter-spacing:.06em;font-weight:500;padding:0 8px 8px;border-bottom:1px solid var(--line)}
table.para td{padding:7px 8px;border-bottom:1px solid var(--line)}
table.para td.case{color:var(--muted);font-family:var(--sans);font-size:12.5px;white-space:nowrap}
.vtable{margin:18px 0}
.vtable h4{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 6px}

.wordlist{margin-top:8px}
.wordrow{display:flex;justify-content:space-between;align-items:center;padding:11px 4px;
  border-bottom:1px solid var(--line);cursor:pointer}
.wordrow:active{background:var(--accent-soft)}
.wordrow .lemma{font-family:var(--serif);font-size:1.05rem}
.wordrow .gloss{color:var(--muted);font-size:13px}
.wordrow .gender{color:var(--faint);font-size:11px;margin-left:6px}

.prompt-box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px 20px;margin:18px 0}
.prompt-head{color:var(--muted);font-size:13px;margin-bottom:4px}
.prompt-lemma{font-family:var(--serif);font-size:1.6rem;margin-bottom:2px}
.prompt-cell{color:var(--coral);font-size:14px;font-weight:600;letter-spacing:.02em}
.answer-row{display:flex;gap:8px;margin-top:16px}
input.ans{flex:1;font-family:var(--serif);font-size:1.15rem;padding:11px 13px;border-radius:10px;
  border:1px solid var(--line);background:var(--raise);color:var(--ink)}
input.ans:focus{outline:none;border-color:var(--coral)}
button.go{background:var(--coral);color:var(--raise);border:none;border-radius:10px;padding:0 18px;font-size:15px;cursor:pointer}
button.go:active{opacity:.85}

.feedback{margin-top:14px;padding:12px 14px;border-radius:10px;font-size:14.5px}
.feedback.ok{background:var(--good-bg);border:1px solid var(--good-br);color:var(--good)}
.feedback.no{background:var(--bad-bg);border:1px solid var(--bad-br);color:var(--bad)}
.feedback .answer{font-family:var(--serif);font-size:1.05rem;margin-top:2px;color:var(--ink)}

.quietlink{background:none;border:none;color:var(--faint);font-size:13px;cursor:pointer;
  padding:8px 0;font-family:var(--sans);text-decoration:underline}
.progress{color:var(--faint);font-size:12.5px;margin-bottom:2px}
.progress-bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:16px}
.progress-fill{height:100%;background:var(--coral)}

.empty{color:var(--muted);text-align:center;padding:40px 10px;font-size:15px}
.note{color:var(--faint);font-size:12.5px;margin-top:10px;line-height:1.5}
.summary-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}
.summary-row .k{color:var(--muted)}

.togglerow{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.togglebtn{background:var(--accent-soft);border:1px solid var(--line);color:var(--muted);
  border-radius:8px;padding:6px 11px;font-size:12.5px;font-family:var(--sans);cursor:pointer}
.togglebtn.active{background:var(--coral);border-color:var(--coral);color:var(--raise)}

/* ---- Stats screen + Study-days calendar (ported from vocabula, 2026-08-09) ---- */
:root{ --amber:#a67c1e; --amber-bg:#efe6cf; }
@media (prefers-color-scheme: dark){ :root{ --amber:#d9b04c; --amber-bg:#3a3018; } }

.s-unseen{background:var(--line)}
.s-learning{background:var(--coral)}
.s-young{background:var(--amber)}
.s-mature{background:var(--good)}
.cellDot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;vertical-align:middle}

.stackbar{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--line);margin-top:4px}
.legend{display:flex;flex-wrap:wrap;gap:10px 16px;margin-top:10px;font-size:12.5px;color:var(--muted)}
.legend .sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:middle}

.wpart{margin:16px 0}
.wpart h3{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;
  font-weight:600;color:var(--muted);margin:0 0 8px;text-transform:none;letter-spacing:0}
.wpart h3 b{color:var(--faint);font-weight:500;font-size:12px}
.wgrid{display:flex;flex-wrap:wrap;gap:3px}
.wbox{width:11px;height:11px;border-radius:2px}

.strip{display:flex;gap:3px;margin-top:6px}
.dot{flex:1;aspect-ratio:1;border-radius:2px;background:var(--line);max-width:9px}
.dot.did{background:var(--coral)}
.dot.today{outline:1.5px solid var(--ink);outline-offset:1px}
.streakNote{margin-top:8px}

.fold{margin-top:14px}
.fold summary{cursor:pointer;color:var(--coral);font-size:13px;list-style:none}
.fold summary::-webkit-details-marker{display:none}
.fold summary::before{content:'\25B8\0020';display:inline-block;transition:transform .15s}
.fold[open] summary::before{transform:rotate(90deg)}

.calHead{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.calNav{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;padding:4px 10px}
.calTitle{font-family:var(--serif);font-size:1rem}
.calDow{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;color:var(--faint);
  font-size:10.5px;margin-top:10px}
.calGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:4px}
.calCell{position:relative;aspect-ratio:1;border-radius:6px;background:var(--panel);
  border:1px solid var(--line);font-size:10px;padding:3px;overflow:hidden}
.calCell.out{opacity:.35;border-color:transparent;background:none}
.calCell.did{background:var(--accent-soft);border-color:var(--coral)}
.calCell.today{border-color:var(--ink);border-width:1.5px}
.calNum{display:block;color:var(--faint);font-size:9.5px}
.calCell.did .calNum{color:var(--muted)}
.calNew,.calWords,.calTot{display:block;font-size:9px;line-height:1.3}
.calNew{color:var(--good)}
.calWords{color:var(--coral)}
.calTot{color:var(--faint)}
</style>
</head>
<body>
<div id="app"></div>

<script src="data/greek-paradigms.js"></script>
<script src="data/greek-vocab.js"></script>
<script src="js/engine.js"></script>
<script src="js/fsrs.js"></script>
<script src="js/stats.js"></script>
<script src="js/sync.js"></script>
<script src="js/greek.js"></script>
<script src="js/greek-input.js"></script>
<script>
/* ======================================================================
   Cotidie — Greek engine UI. Same three-mode shape as latin.html (Table
   -> Recite -> Drill), adapted for what's actually different about Greek:
     - grading (js/greek.js): breathing always required, accent
       toggleable (default off, per the real OCR A-level spec -- see
       data/greek-paradigms.js's header), movable-nu handling.
     - typing (js/greek-input.js): Karsten's own Hoplite KB scheme
       reimplemented in-browser, not the OS Greek Polytonic layout --
       toggleable per input, in case he'd rather paste or use the OS
       layout for a given session.
     - every class here is `literal: true` and has exactly one vocab word
       (see greek-paradigms.js/greek-vocab.js for why) -- so the
       Table/Recite word list skips the separate "(example)" row
       latin.html shows, since it would just duplicate the one real entry.
   ====================================================================== */

const NOUN_CLASSES = classesOfKind(GREEK_PARADIGMS, 'noun');
const THEMATIC_CLASSES = classesOfKind(GREEK_PARADIGMS, 'verb').filter(k => !k.startsWith('athematic'));
const ATHEMATIC_CLASSES = classesOfKind(GREEK_PARADIGMS, 'verb').filter(k => k.startsWith('athematic'));

const STORE_KEY = 'cotidie.greek.v1';
const GIST_FILE = 'cotidie-greek.json';   // one shared gist, two files -- see js/sync.js
let store = loadStore(STORE_KEY);
// Extra Greek-only settings, layered onto the shared fsrs.js store shape
// rather than touched inside fsrs.js itself (which stays language-
// agnostic). Defaults match the real OCR spec finding: breathings are
// always required (not a setting), accents are not expected to be
// written so default OFF; Hoplite input defaults ON since that's
// Karsten's own daily tool.
if (store.settings.requireAccents === undefined) store.settings.requireAccents = false;
if (store.settings.hopliteInput === undefined) store.settings.hopliteInput = true;

let view = { screen:'home' };

// Study-days calendar's own view state (HANDOFF.md §10c) -- not persisted,
// resets to the current month each fresh load, same as vocabula's calY/calM.
let calY=null, calM=null, calOpen=false;

const app = document.getElementById('app');
let hopliteCtrl = null; // controller for whichever input is currently on screen

function render(){
  hopliteCtrl = null;
  if (view.screen==='home') app.innerHTML = renderHome();
  else if (view.screen==='system') app.innerHTML = renderSystem(view.cls, view.tab||'table');
  else if (view.screen==='recite') renderRecite();
  else if (view.screen==='drill') renderDrill();
  else if (view.screen==='stats') app.innerHTML = renderStats();
  else if (view.screen==='settings') app.innerHTML = renderSettings();
}

function go(next){ view = next; render(); window.scrollTo(0,0); }

function gradeOpts(){ return { accents: store.settings.requireAccents }; }

// ---------------------------------------------------------------- HOME ----
function dueCount(){ return dueCards(store, GREEK_VOCAB, GREEK_VOCAB, GREEK_PARADIGMS, Date.now()).length; }

function renderHome(){
  const n = dueCount();
  const studyLine = n>0 ? n+' due now' : 'nothing due — practice anytime below';
  let h = `
    <h1>Cotidie</h1>
    <p class="sub">Greek — grammar production practice</p>
    <button class="card study" data-action="start-drill">
      <div class="t">Review</div>
      <div class="d">${studyLine}</div>
    </button>
    <button class="card" data-action="open-stats">
      <div class="t">Stats</div>
      <div class="d">Where you stand, by system</div>
    </button>
    <button class="card" data-action="open-settings">
      <div class="t">Settings</div>
      <div class="d">Cloud sync</div>
    </button>
    <div class="sect">
      <h3>Study days</h3>
      <div class="strip">${stripHtml()}</div>
      <p class="note streakNote">${streakNoteText()}</p>
      <details class="fold"${calOpen?' open':''}>
        <summary data-action="toggle-cal">Full calendar</summary>
        ${calOpen?calendarHtml():''}
      </details>
    </div>
    <div class="sect"><h3>Nouns</h3>`;
  NOUN_CLASSES.forEach(k=>{
    const c = GREEK_PARADIGMS[k];
    h += `<button class="card" data-action="open-system" data-cls="${k}">
      <div class="t">${c.label}</div><div class="d">${c.subtitle}</div></button>`;
  });
  h += `</div><div class="sect"><h3>Thematic (-ω) verbs</h3>`;
  THEMATIC_CLASSES.forEach(k=>{
    const c = GREEK_PARADIGMS[k];
    h += `<button class="card" data-action="open-system" data-cls="${k}">
      <div class="t">${c.label}</div><div class="d">${c.subtitle}</div></button>`;
  });
  h += `</div><div class="sect"><h3>Athematic (-μι) verbs</h3>`;
  ATHEMATIC_CLASSES.forEach(k=>{
    const c = GREEK_PARADIGMS[k];
    h += `<button class="card" data-action="open-system" data-cls="${k}">
      <div class="t">${c.label}</div><div class="d">${c.subtitle}</div></button>`;
  });
  h += `</div>
    <p class="note">Table always open; Drill pulled from whatever's actually due. Breathings always graded; accents ${store.settings.requireAccents?'required':'optional'} (change this from any Recite/Drill screen). See Cotidie's HANDOFF.md for the reasoning — nothing here is timed or gamified.</p>`;
  return h;
}

// ----------------------------------------------- STUDY DAYS / STATS (§10c) ----
// All derived on demand from store.log via js/stats.js's computeDayIndex() --
// no persisted day-aggregate, see that file's own header comment for why.
function stripHtml(){
  const idx = computeDayIndex(store.log, store.settings.rollover);
  const d = dayKey(Date.now(), store.settings.rollover);
  let h = '';
  for (let i=34; i>=0; i--){
    const did = idx[d-i] && idx[d-i].n;
    h += `<div class="dot${did?' did':''}${i===0?' today':''}"></div>`;
  }
  return h;
}
function streakNoteText(){
  const idx = computeDayIndex(store.log, store.settings.rollover);
  const streak = currentStreak(idx, dayKey(Date.now(), store.settings.rollover));
  return streak ? (streak+' day'+(streak===1?'':'s')+' running') : 'No streak yet — the first day starts it.';
}
function calendarHtml(){
  if (calY==null){ const n=new Date(); calY=n.getFullYear(); calM=n.getMonth(); }
  const idx = computeDayIndex(store.log, store.settings.rollover);
  const d0 = dayKey(Date.now(), store.settings.rollover);
  const sun = new Date(); sun.setDate(sun.getDate()-sun.getDay());
  const dowHtml = [0,1,2,3,4,5,6].map(i =>
    `<div>${new Date(sun.getFullYear(),sun.getMonth(),sun.getDate()+i).toLocaleDateString(undefined,{weekday:'narrow'})}</div>`
  ).join('');
  let gridHtml = '';
  monthMatrix(calY,calM).forEach(week => week.forEach(cell => {
    if (!cell.inMonth){ gridHtml += `<div class="calCell out">${cell.d}</div>`; return; }
    const dk = dayKeyForDate(cell.y, cell.m, cell.d, store.settings.rollover);
    const st = dayStatsFor(idx, dk);
    const cls = ['calCell'];
    if (st.studied) cls.push('did');
    if (dk===d0) cls.push('today');
    const nums = st.studied
      ? `<span class="calNew">${st.intro}</span><span class="calWords">${st.words}</span><span class="calTot">${st.ratings}</span>`
      : '';
    gridHtml += `<div class="${cls.join(' ')}"><span class="calNum">${cell.d}</span>${nums}</div>`;
  }));
  return `
    <div class="calHead">
      <button class="calNav" data-action="cal-prev" aria-label="Previous month">&lsaquo;</button>
      <div class="calTitle">${new Date(calY,calM,1).toLocaleDateString(undefined,{month:'long',year:'numeric'})}</div>
      <button class="calNav" data-action="cal-next" aria-label="Next month">&rsaquo;</button>
    </div>
    <div class="calDow">${dowHtml}</div>
    <div class="calGrid">${gridHtml}</div>`;
}
function shiftCalMonth(delta){
  if (calY==null){ const n=new Date(); calY=n.getFullYear(); calM=n.getMonth(); }
  calM += delta;
  if (calM<0){ calM=11; calY--; } else if (calM>11){ calM=0; calY++; }
}

function renderStats(){
  const { totals, bySystem } = wholeDeckStats(store, GREEK_VOCAB, GREEK_PARADIGMS);
  const total = STATUS_ORDER.reduce((n,k) => n+totals[k], 0);
  let barHtml = '';
  STATUS_ORDER.forEach(k => {
    const n = totals[k]; if (!n) return;
    barHtml += `<div class="s-${k}" style="width:${100*n/total}%" title="${STATUS_LABEL[k]}: ${n}"></div>`;
  });
  let legendHtml = '';
  STATUS_ORDER.forEach(k => {
    const n = totals[k]; if (!n) return;
    legendHtml += `<span><i class="sw s-${k}"></i>${STATUS_LABEL[k]} — ${n} (${Math.round(100*n/total)}%)</span>`;
  });
  const allClasses = [...NOUN_CLASSES, ...THEMATIC_CLASSES, ...ATHEMATIC_CLASSES];
  let gridHtml = '';
  allClasses.forEach(k => {
    const sys = bySystem[k]; if (!sys) return;
    const met = sys.cells.filter(s => s!=='unseen').length;
    gridHtml += `<div class="wpart"><h3><span>${escHtml(GREEK_PARADIGMS[k].label)}</span><b>${met} / ${sys.cells.length}</b></h3><div class="wgrid">`;
    sys.cells.forEach(s => { gridHtml += `<div class="wbox s-${s}"></div>`; });
    gridHtml += `</div></div>`;
  });
  return `
    <div class="topbar"><button class="back" data-action="home">&larr; Cotidie</button></div>
    <h2>Stats</h2>
    <p class="sub">Every cell across every system — not just what's due.</p>
    <div class="sect" style="margin-top:8px">
      <h3>Where you stand</h3>
      <div class="stackbar">${barHtml}</div>
      <div class="legend">${legendHtml}</div>
    </div>
    <div class="sect"><h3>By system</h3>${gridHtml || '<p class="empty">No systems to show.</p>'}</div>`;
}

// ------------------------------------------------------------- SYNC (§10e) ----
// Credentials live only in js/sync.js's shared key, never duplicated into
// this deck's own store.settings -- see that file's header comment.
let saveTimer = null;
let syncedLogLen = null;   // last log length both sides agreed on, this session
let lastSyncNote = null;   // {when, note} -- shown on the Settings screen

// Replaces the old bare saveStore(STORE_KEY, store) call sites: saves
// locally as before, and additionally schedules a debounced push (6s after
// the last save, same interval as vocabula's own) if a gist is configured.
function save(){
  saveStore(STORE_KEY, store);
  const cred = loadSharedGist();
  if (cred.gistId && cred.gistTok){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => { saveTimer = null; doPush(); }, 6000);
  }
}
function flushPendingPush(){
  if (saveTimer){ clearTimeout(saveTimer); saveTimer = null; doPush(); }
}

async function doPush(){
  const cred = loadSharedGist();
  const res = await pushStore(store, cred.gistId, cred.gistTok, GIST_FILE);
  lastSyncNote = res.ok
    ? { when: Date.now(), note: 'Pushed' }
    : { when: Date.now(), note: 'Push failed ('+res.error+')' };
  if (res.ok) syncedLogLen = store.log.length;
  if (view.screen==='settings') render();
  return res;
}

// Pull-and-reconcile, the same three-way split as vocabula's syncOnLaunch:
// only remote moved -> adopt silently; only local moved -> push; both moved
// past the last-agreed point -> a genuine conflict, ask.
async function doPull(){
  const cred = loadSharedGist();
  const res = await fetchStore(cred.gistId, cred.gistTok, GIST_FILE);
  if (!res.ok){
    lastSyncNote = { when: Date.now(), note: 'Pull failed ('+res.error+')' };
    if (view.screen==='settings') render();
    return res;
  }
  const base = (syncedLogLen==null) ? store.log.length : syncedLogLen;
  const decision = syncDecision(store.log.length, res.store.log.length, base);
  if (decision==='conflict'){
    const ok = confirm(
      'This device and the gist both have reviews the other hasn’t seen.\n\n'+
      'OK = replace this device’s reviews with the gist’s ('+res.store.log.length+' total, this device has '+store.log.length+').\n'+
      'Cancel = keep this device’s copy and push it to the gist instead.');
    if (ok){ store = adoptStore(res.store); syncedLogLen = store.log.length; saveStore(STORE_KEY, store);
      lastSyncNote = { when: Date.now(), note: 'Took the gist’s copy' }; }
    else { await doPush(); lastSyncNote = { when: Date.now(), note: 'Kept this device, pushed' }; }
  } else if (decision==='take-remote'){
    store = adoptStore(res.store); syncedLogLen = store.log.length; saveStore(STORE_KEY, store);
    lastSyncNote = { when: Date.now(), note: 'Synced '+store.log.length+' reviews from the gist' };
  } else if (decision==='push-local'){
    await doPush();
  } else {
    lastSyncNote = { when: Date.now(), note: 'Already in sync' };
  }
  render();
  return res;
}

// Runs when the tab becomes visible again on the Home screen -- mirrors
// vocabula's syncOnLaunch(), simplified: a genuine conflict is left for the
// user to resolve explicitly via "Pull now" on Settings (its confirm()),
// rather than popping one unprompted the moment the tab regains focus.
async function syncOnLaunch(){
  const cred = loadSharedGist();
  if (!cred.gistId || !cred.gistTok) return;
  const lenAtStart = store.log.length;
  const res = await fetchStore(cred.gistId, cred.gistTok, GIST_FILE);
  if (!res.ok) return;
  if (store.log.length !== lenAtStart) return;   // rated while the fetch was in flight
  const base = (syncedLogLen==null) ? store.log.length : syncedLogLen;
  const decision = syncDecision(store.log.length, res.store.log.length, base);
  if (decision==='take-remote'){
    store = adoptStore(res.store); syncedLogLen = store.log.length; saveStore(STORE_KEY, store);
    lastSyncNote = { when: Date.now(), note: 'Synced '+store.log.length+' reviews from another device' };
    if (view.screen==='home') render();
  } else if (decision==='push-local'){
    await doPush();
  }
}

function renderSettings(){
  const cred = loadSharedGist();
  const configured = !!(cred.gistId && cred.gistTok);
  const noteLine = lastSyncNote ? (lastSyncNote.note+' — '+new Date(lastSyncNote.when).toLocaleTimeString()) : 'Not synced yet this session.';
  return `
    <div class="topbar"><button class="back" data-action="home">&larr; Cotidie</button></div>
    <h2>Settings</h2>
    <p class="sub">Sync status for this deck.</p>
    <div class="sect" style="margin-top:8px">
      <h3>Cloud sync</h3>
      ${configured ? `
        <p class="note">Gist: ${escHtml(cred.gistId)}</p>
        <button class="card" data-action="sync-push"><div class="t">Push now</div><div class="d">send this device's reviews</div></button>
        <button class="card" data-action="sync-pull"><div class="t">Pull now</div><div class="d">fetch from the gist</div></button>
        <p class="note">${escHtml(noteLine)}</p>
      ` : `
        <p class="note">No gist set up yet. Open the Cotidie launcher and enter a gist ID and token
        (or paste a pairing code from another device) to turn this on.</p>
      `}
    </div>`;
}

// -------------------------------------------------------------- SYSTEM ----
function wordsOfClass(clsKey){
  return GREEK_VOCAB.map((e,i)=>({e,i})).filter(x=>x.e.class===clsKey);
}

function renderSystem(clsKey, tab){
  const cls = GREEK_PARADIGMS[clsKey];
  let h = `
    <div class="topbar"><button class="back" data-action="home">&larr; Cotidie</button></div>
    <h2>${cls.label}</h2>
    <p class="sub">${cls.subtitle}</p>
    <div class="tabs">
      <button class="${tab==='table'?'on':''}" data-action="tab" data-tab="table">Table</button>
      <button class="${tab==='recite'?'on':''}" data-action="tab" data-tab="recite">Recite</button>
    </div>`;

  if (tab==='table'){
    h += cls.kind==='noun' ? renderNounTable(cls) : renderVerbTables(cls);
    h += `<button class="card" data-action="start-drill" data-cls="${clsKey}" style="margin-top:14px">
      <div class="t">Drill this system</div><div class="d">${dueCards(store, wordsOfClass(clsKey).map(x=>x.e), GREEK_VOCAB, GREEK_PARADIGMS, Date.now()).length} due</div>
    </button>`;
  } else {
    h += `<p class="note" style="margin:0 0 12px">Recite the whole paradigm in order, from memory.</p>
      <div class="wordlist">`;
    wordsOfClass(clsKey).forEach(({e,i}) => { h += wordRow(e, i, clsKey); });
    h += `</div>`;
  }
  return h;
}

function wordRow(entry, vocabIndex, clsKey){
  const g = entry.gender ? `<span class="gender">${entry.gender}.</span>` : '';
  return `<div class="wordrow" data-action="start-recite" data-cls="${clsKey}" data-idx="${vocabIndex}">
    <div><span class="lemma">${entry.lemma}</span>${g}</div>
    <div class="gloss">${entry.meaning}</div>
  </div>`;
}

// Per-cell status dots (HANDOFF.md §10d) summarize across the class's real
// vocab words -- see cellStatusSummary()'s own comment for why this can't
// just point at cls.example's own cells.
function dotHtml(st){ return `<i class="cellDot s-${st}" title="${STATUS_LABEL[st]}"></i>`; }

function renderNounTable(cls){
  const clsKey = cls.example.class;
  const rows = cls.categories.map(cat=>{
    const sg = formsFor(GREEK_PARADIGMS, cls.example, cat, 'sg').primary;
    const pl = formsFor(GREEK_PARADIGMS, cls.example, cat, 'pl').primary;
    const sgSt = cellStatusSummary(store, GREEK_VOCAB, clsKey, cat, 'sg');
    const plSt = cellStatusSummary(store, GREEK_VOCAB, clsKey, cat, 'pl');
    return `<tr><td class="case">${GREEK_CATEGORY_LABELS[cat]}</td><td>${dotHtml(sgSt)}${sg}</td><td>${dotHtml(plSt)}${pl}</td></tr>`;
  }).join('');
  return `<table class="para"><tr><th></th><th>Singular</th><th>Plural</th></tr>${rows}</table>`;
}

function renderVerbTables(cls){
  const clsKey = cls.example.class;
  let h = '';
  cls.categories.forEach(cat=>{
    const p1s=formsFor(GREEK_PARADIGMS, cls.example,cat,'1sg').primary, p1p=formsFor(GREEK_PARADIGMS, cls.example,cat,'1pl').primary;
    const p2s=formsFor(GREEK_PARADIGMS, cls.example,cat,'2sg').primary, p2p=formsFor(GREEK_PARADIGMS, cls.example,cat,'2pl').primary;
    const p3s=formsFor(GREEK_PARADIGMS, cls.example,cat,'3sg').primary, p3p=formsFor(GREEK_PARADIGMS, cls.example,cat,'3pl').primary;
    const d1s=dotHtml(cellStatusSummary(store,GREEK_VOCAB,clsKey,cat,'1sg')), d1p=dotHtml(cellStatusSummary(store,GREEK_VOCAB,clsKey,cat,'1pl'));
    const d2s=dotHtml(cellStatusSummary(store,GREEK_VOCAB,clsKey,cat,'2sg')), d2p=dotHtml(cellStatusSummary(store,GREEK_VOCAB,clsKey,cat,'2pl'));
    const d3s=dotHtml(cellStatusSummary(store,GREEK_VOCAB,clsKey,cat,'3sg')), d3p=dotHtml(cellStatusSummary(store,GREEK_VOCAB,clsKey,cat,'3pl'));
    h += `<div class="vtable"><h4>${GREEK_CATEGORY_LABELS[cat]}</h4>
      <table class="para"><tr><th></th><th>Singular</th><th>Plural</th></tr>
      <tr><td class="case">1st</td><td>${d1s}${p1s}</td><td>${d1p}${p1p}</td></tr>
      <tr><td class="case">2nd</td><td>${d2s}${p2s}</td><td>${d2p}${p2p}</td></tr>
      <tr><td class="case">3rd</td><td>${d3s}${p3s}</td><td>${d3p}${p3p}</td></tr>
      </table></div>`;
  });
  return h;
}

// ---------------------------------------------------------- input setup ----
// Wires the Hoplite scheme onto #ansInput (if enabled) and returns the
// toggle-row HTML for the two settings (Greek keys, accent grading) --
// shared by both Recite and Drill prompts.
function setupAnswerInput(){
  const inp = document.getElementById('ansInput');
  inp.focus();
  hopliteCtrl = attachHopliteInput(inp);
  if (!store.settings.hopliteInput) hopliteCtrl.disable();
}

function toggleRowHtml(){
  return `<div class="togglerow">
    <button class="togglebtn ${store.settings.hopliteInput?'active':''}" data-action="toggle-hoplite">Greek keys: ${store.settings.hopliteInput?'on':'off'}</button>
    <button class="togglebtn ${store.settings.requireAccents?'active':''}" data-action="toggle-accents">Accents: ${store.settings.requireAccents?'required':'optional'}</button>
  </div>`;
}

// -------------------------------------------------------------- RECITE ----
// Recitation is deliberately NOT logged to the FSRS review store -- see
// latin.html's identical note, same reasoning applies here.
let reciteState = null;

function renderRecite(){
  const { entry, cells } = reciteState;
  if (reciteState.pos >= cells.length){
    app.innerHTML = `
      <div class="topbar"><button class="back" data-action="back-to-system">&larr; ${GREEK_PARADIGMS[reciteState.clsKey].label}</button></div>
      <h2>Recited in full</h2>
      <p class="sub">${entry.lemma} — ${entry.meaning}</p>
      <button class="card study" data-action="start-drill" data-cls="${reciteState.clsKey}">
        <div class="t">Drill this system now</div><div class="d">random cells, auto-graded</div>
      </button>
      <button class="card" data-action="back-to-system"><div class="t">Back to ${GREEK_PARADIGMS[reciteState.clsKey].label}</div></button>`;
    attachDelegate(); return;
  }
  const cell = cells[reciteState.pos];
  const label = cellLabel(cell);
  reciteState.promptShownAt = Date.now();
  app.innerHTML = `
    <div class="topbar"><button class="back" data-action="back-to-system">&larr; ${GREEK_PARADIGMS[reciteState.clsKey].label}</button></div>
    <div class="progress">Reciting ${entry.lemma} — ${reciteState.pos+1} of ${cells.length}</div>
    <div class="progress-bar"><div class="progress-fill" style="width:${100*reciteState.pos/cells.length}%"></div></div>
    <div class="prompt-box">
      <div class="prompt-head">${entry.meaning}</div>
      <div class="prompt-lemma">${entry.lemma}</div>
      <div class="prompt-cell">${label}</div>
      <div class="answer-row">
        <input class="ans" id="ansInput" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="type the form">
        <button class="go" data-action="recite-submit">&rarr;</button>
      </div>
      <div id="reciteFeedback"></div>
      ${toggleRowHtml()}
    </div>
    <button class="quietlink" data-action="recite-reveal">show answer</button>`;
  attachDelegate();
  setupAnswerInput();
  document.getElementById('ansInput').addEventListener('keydown', e => { if (e.key==='Enter') submitRecite(); });
}

function cellLabel(cell){
  return GREEK_CATEGORY_LABELS[cell.category] + ' · ' + GREEK_CELL_LABELS[cell.cell];
}

function submitRecite(){
  const inp = document.getElementById('ansInput');
  const cell = reciteState.cells[reciteState.pos];
  const forms = formsFor(GREEK_PARADIGMS, reciteState.entry, cell.category, cell.cell);
  const correct = checkAnswerGreek(inp.value, forms.accepted, gradeOpts());
  showReciteFeedback(correct, forms.primary);
}
function showReciteFeedback(correct, primary){
  const fb = document.getElementById('reciteFeedback');
  fb.innerHTML = correct
    ? `<div class="feedback ok">Right.</div>`
    : `<div class="feedback no">Not quite. <div class="answer">${primary}</div></div>`;
  document.getElementById('ansInput').disabled = true;
  const goBtn = document.querySelector('[data-action="recite-submit"]');
  if (goBtn) goBtn.disabled = true;
  setTimeout(() => { reciteState.pos++; renderRecite(); }, correct ? 550 : 1600);
}

// --------------------------------------------------------------- DRILL ----
// Same fixed-snapshot-per-session design as latin.html -- see its note.
let drillState = null;

function startDrill(clsKeyOrNull){
  const pool = clsKeyOrNull ? wordsOfClass(clsKeyOrNull).map(x=>x.e) : GREEK_VOCAB;
  const due = dueCards(store, pool, GREEK_VOCAB, GREEK_PARADIGMS, Date.now());
  drillState = { clsKey:clsKeyOrNull, queue:due, pos:0, correct:0, total:due.length };
  go({ screen:'drill' });
}

function renderDrill(){
  if (!drillState || drillState.total===0){
    app.innerHTML = `
      <div class="topbar"><button class="back" data-action="home">&larr; Cotidie</button></div>
      <h2>Nothing due</h2>
      <p class="empty">No cards are due${drillState&&drillState.clsKey?' in '+GREEK_PARADIGMS[drillState.clsKey].label:''} right now.<br>Come back later, or drill anyway if you want the extra practice.</p>
      <button class="card" data-action="start-drill-anyway" data-cls="${drillState&&drillState.clsKey?drillState.clsKey:''}">
        <div class="t">Drill anyway</div><div class="d">practice ahead of schedule</div></button>
      <button class="card" data-action="home"><div class="t">Back to Cotidie</div></button>`;
    attachDelegate(); return;
  }
  if (drillState.pos >= drillState.queue.length){
    app.innerHTML = `
      <div class="topbar"><button class="back" data-action="home">&larr; Cotidie</button></div>
      <h2>Session done</h2>
      <div class="summary-row"><span class="k">Reviewed</span><span>${drillState.total}</span></div>
      <div class="summary-row"><span class="k">Correct</span><span>${drillState.correct} / ${drillState.total}</span></div>
      <button class="card" data-action="home" style="margin-top:16px"><div class="t">Back to Cotidie</div></button>`;
    attachDelegate(); return;
  }
  const item = drillState.queue[drillState.pos];
  const label = cellLabel(item);
  drillState.promptShownAt = Date.now();
  app.innerHTML = `
    <div class="topbar"><button class="back" data-action="home">&larr; Cotidie</button></div>
    <div class="progress">Review — ${drillState.pos+1} of ${drillState.queue.length}</div>
    <div class="progress-bar"><div class="progress-fill" style="width:${100*drillState.pos/drillState.queue.length}%"></div></div>
    <div class="prompt-box">
      <div class="prompt-head">${item.entry.meaning}</div>
      <div class="prompt-lemma">${item.entry.lemma}</div>
      <div class="prompt-cell">${label}</div>
      <div class="answer-row">
        <input class="ans" id="ansInput" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="type the form">
        <button class="go" data-action="drill-submit">&rarr;</button>
      </div>
      <div id="drillFeedback"></div>
      ${toggleRowHtml()}
    </div>
    <p class="note">Breathing marks always graded. Movable ν always accepted either way.</p>`;
  attachDelegate();
  setupAnswerInput();
  document.getElementById('ansInput').addEventListener('keydown', e => { if (e.key==='Enter') submitDrill(); });
}

function submitDrill(){
  const inp = document.getElementById('ansInput');
  if (inp.disabled) return;
  const item = drillState.queue[drillState.pos];
  const forms = formsFor(GREEK_PARADIGMS, item.entry, item.category, item.cell);
  const latency = Date.now() - drillState.promptShownAt;
  const correct = checkAnswerGreek(inp.value, forms.accepted, gradeOpts());
  if (correct) drillState.correct++;

  const meta = { vocabIndex: GREEK_VOCAB.indexOf(item.entry), category:item.category, cell:item.cell, lemma:item.entry.lemma };
  const result = recordReview(store, meta, correct, latency, Date.now());
  save();

  const fb = document.getElementById('drillFeedback');
  const ratingWord = {1:'Again',2:'Hard',3:'Good',4:'Easy'}[result.rating];
  fb.innerHTML = correct
    ? `<div class="feedback ok">Right — ${ratingWord}.</div>`
    : `<div class="feedback no">Not quite. <div class="answer">${forms.primary}</div></div>`;
  inp.disabled = true;
  const goBtn = document.querySelector('[data-action="drill-submit"]');
  if (goBtn) goBtn.disabled = true;
  setTimeout(() => { drillState.pos++; renderDrill(); }, correct ? 550 : 1800);
}

// ------------------------------------------------------------ delegation ----
function attachDelegate(){
  app.onclick = e => {
    const el = e.target.closest('[data-action]');
    if (!el) return;
    const action = el.dataset.action;
    if (action==='home') go({screen:'home'});
    else if (action==='open-stats') go({screen:'stats'});
    else if (action==='open-settings') go({screen:'settings'});
    else if (action==='sync-push') doPush();
    else if (action==='sync-pull') doPull();
    else if (action==='toggle-cal'){ e.preventDefault(); calOpen=!calOpen; render(); }
    else if (action==='cal-prev'){ shiftCalMonth(-1); render(); }
    else if (action==='cal-next'){ shiftCalMonth(1); render(); }
    else if (action==='open-system') go({screen:'system', cls:el.dataset.cls, tab:'table'});
    else if (action==='tab') go({screen:'system', cls:view.cls, tab:el.dataset.tab});
    else if (action==='back-to-system') go({screen:'system', cls:reciteState?reciteState.clsKey:view.cls, tab:'recite'});
    else if (action==='start-drill') startDrill(null);
    else if (action==='start-drill-anyway') startDrillAnyway(el.dataset.cls||null);
    else if (action==='start-recite'){
      const clsKey = el.dataset.cls;
      const idx = parseInt(el.dataset.idx,10);
      const entry = GREEK_VOCAB[idx];
      reciteState = { entry, clsKey, cells: orderedCells(GREEK_PARADIGMS, clsKey), pos:0 };
      go({ screen:'recite' });
    }
    else if (action==='recite-submit') submitRecite();
    else if (action==='recite-reveal'){
      const cell = reciteState.cells[reciteState.pos];
      const forms = formsFor(GREEK_PARADIGMS, reciteState.entry, cell.category, cell.cell);
      showReciteFeedback(false, forms.primary);
    }
    else if (action==='drill-submit') submitDrill();
    else if (action==='toggle-hoplite'){
      store.settings.hopliteInput = !store.settings.hopliteInput;
      save();
      if (hopliteCtrl) { store.settings.hopliteInput ? hopliteCtrl.enable() : hopliteCtrl.disable(); }
      render();
    }
    else if (action==='toggle-accents'){
      store.settings.requireAccents = !store.settings.requireAccents;
      save();
      render();
    }
  };
}

function startDrillAnyway(clsKeyOrNull){
  const pool = clsKeyOrNull ? wordsOfClass(clsKeyOrNull).map(x=>x.e) : GREEK_VOCAB;
  const queue = [];
  pool.forEach(entry => orderedCells(GREEK_PARADIGMS, entry.class).forEach(({category,cell}) =>
    queue.push({ vocabIndex: GREEK_VOCAB.indexOf(entry), entry, category, cell })));
  for (let i=queue.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [queue[i],queue[j]]=[queue[j],queue[i]]; }
  drillState = { clsKey:clsKeyOrNull, queue, pos:0, correct:0, total:queue.length };
  go({ screen:'drill' });
}

attachDelegate();
render();

// Flush a pending debounced push immediately on tab-hide/close rather than
// dropping it silently; check for remote changes when coming back to Home.
// Same pattern as vocabula's own visibilitychange/pagehide hooks.
document.addEventListener('visibilitychange', () => {
  if (document.hidden) flushPendingPush();
  else if (view.screen==='home') syncOnLaunch();
});
window.addEventListener('pagehide', flushPendingPush);
</script>
