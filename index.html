<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Cotidie</title>
<style>
:root{
  --serif:"Palatino","Palatino Linotype","Book Antiqua",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  --bg:#fbf7ec; --panel:#f5efdf; --ink:#2a2318; --muted:#6f6350; --faint:#988c75;
  --line:#e3d9c1; --coral:#8c2f26; --accent-soft:#f0e3d8; --raise:#fffdf6;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#1a160f; --panel:#241f16; --ink:#ece3cf; --muted:#a89a80; --faint:#7a6f5c;
    --line:#3a3222; --coral:#d4795e; --accent-soft:#3f2a1f; --raise:#2c2519;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg)}
body{
  color:var(--ink); font-family:var(--sans); font-size:16px; line-height:1.6;
  -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%;
  padding:calc(52px + env(safe-area-inset-top)) 20px calc(40px + env(safe-area-inset-bottom));
  max-width:30rem; margin:0 auto;
}
h1{font-family:var(--serif);font-weight:400;font-size:2.05rem;margin:0 0 4px}
.sub{color:var(--muted);font-size:14.5px;margin:0 0 30px}
a.card{display:block;text-decoration:none;color:inherit;background:var(--panel);
  border:1px solid var(--line);border-radius:14px;padding:15px 18px;margin-bottom:10px}
a.card:active{border-color:var(--coral);background:var(--accent-soft)}
a.card .t{font-family:var(--serif);font-size:1.28rem;margin-bottom:2px}
a.card .d{color:var(--muted);font-size:13.5px}
.sect{margin-top:30px}
.sect h2{font-size:12.5px;font-weight:500;color:var(--faint);text-transform:uppercase;
  letter-spacing:.07em;margin:0 0 12px}
</style>
</head>
<body>

</div>
</body>
</html>
